				const i = Number(b.dataset.i);
				st.promptOpen = st.promptOpen === i ? null : i;
				st.pdraft = null;
				paint();
				return;
			}
			if (k === "medit") {
				const i = Number(b.dataset.i);
				st.editOpen = st.editOpen === i ? null : i;
				st.edraft = "";
				paint();
				return;
			}
			if (k === "mclose") {
				st.editOpen = null;
				paint();
				return;
			}
			if (k === "mapply") {
				const i = Number(b.dataset.i);
				const inp = box.querySelector(`#pv-medit-${i}`);
				const r = AC.editSlotImage(S, s.id, i, inp ? inp.value : "");
				if (!r.ok) return toast(r.error, "bad");
				st.editOpen = null;
				save();
				render();
				paint();
				toast(`Đã tạo ảnh phiên bản ${r.version} theo yêu cầu.`);
				return;
			}
			if (k === "pclose") {
				st.promptOpen = null;
				st.pdraft = null;
				paint();
				return;
			}
			if (k === "psave" || k === "pgen") {
				const i = Number(b.dataset.i);
				const ta = box.querySelector(`#pv-prompt-${i}`);
				const r = AC.setSlotImagePrompt(S, s.id, i, ta ? ta.value : "");
				if (!r.ok) return toast(r.error, "bad");
				st.pdraft = null;
				if (k === "pgen" && AC.imageApiOn(S)) {
					st.promptOpen = null;
					save();
					render();
					paint();
					apiGenImage(s, i);
					return;
				}
				if (k === "pgen") {
					const g = AC.genSlotImage(S, s.id, i);
					if (!g.ok) return toast(g.error, "bad");
					st.promptOpen = null;
					toast(`Đã tạo ảnh phiên bản ${g.version} từ prompt mới.`);
				} else toast("Đã lưu prompt.");
				save();
				render();
				paint();
				return;
			}
			if (k === "pub") {
				if (await publishDialog(s)) paint();
				return;
			}
			if (k === "unpub") {
				if (!await confirmBox({
					title: "Bỏ đánh dấu đã đăng?",
					body: "<p>Slot về \"Đã duyệt\"; link và số liệu của bài bị xóa. Bài trên kênh không bị gỡ.</p>",
					ok: "Bỏ đánh dấu",
					danger: true
				})) return;
				const r = AC.unmarkPublished(S, s.id);
				if (!r.ok) return toast(r.error, "bad");
				save();
				render();
				paint();
				toast("Đã bỏ đánh dấu đã đăng.");
				return;
			}
			if (k === "edit") {
				st.edit = true;
				st.draft = s.text;
				st.more = true;
				paint();
				const ta = box.querySelector(".pv-seg") || box.querySelector("#pv-edit");
				if (ta) ta.focus();
				return;
			}
			if (k === "cancel") {
				if (st.draft !== s.text && !await confirmBox({
					title: "Bỏ các thay đổi?",
					body: "<p>Chữ bạn vừa sửa chưa được lưu.</p>",
					ok: "Bỏ thay đổi",
					danger: true
				})) return;
				st.edit = false;
				st.promptOpen = null;
				paint();
				return;
			}
			if (k === "save") {
				if (st.draft === s.text) {
					st.edit = false;
					paint();
					return;
				}
				const r = AC.editSlot(S, s.id, st.draft);
				if (!r.ok) return toast(r.error, "bad");
				if (st.hookKind) {
					AC.setSlotHookKind(S, s.id, st.hookKind);
					st.hookKind = null;
				}
				st.edit = false;
				st.promptOpen = null;
				save();
				render();
				paint();
				toast("Đã lưu bản sửa. Slot chờ duyệt lại.");
				return;
			}
			if (k === "regen") {
				const r = await withAiText((C) => AC.regenSlot(C, s.id));
				if (!r.ok) return toast(r.error, "bad");
				st.slide = 0;
				st.more = false;
				save();
				render();
				paint();
				toast(`Đã tạo bản ${r.n}. Bấm Hoàn tác để quay lại bản trước.`);
				return;
			}
			if (k === "undo") {
				const r = AC.useSlotVersion(S, s.id, s.undoN);
				if (!r.ok) return toast(r.error, "bad");
				st.slide = 0;
				save();
				render();
				paint();
				toast("Đã quay lại bản trước.");
				return;
			}
			if (k === "approve") {
				const nw = AC.slotWarnings(S, s).length;
				if (nw && !await confirmBox({
					title: "Duyệt slot có cảnh báo?",
					body: `<p>Slot này có ${nw} cảnh báo. Cảnh báo chỉ để tham khảo; bạn vẫn duyệt được.</p>`,
					ok: "Vẫn duyệt"
				})) return;
				const r = AC.approveSlot(S, s.id);
				if (!r.ok) return toast(r.error, "bad");
				save();
				render();
				paint();
				toast("Đã duyệt slot.");
				return;
			}
			if (k === "carousel") {
				openCarouselEditor(s, () => {
					save();
					render();
					st.slide = 0;
					paint();
				});
				return;
			}
			if (k === "repurpose") {
				openRepurposeDialog(s);
				return;
			}
			if (k === "detail") {
				if (st.edit && st.draft !== s.text) return toast("Lưu hoặc Hủy bản sửa trước.", "bad");
				openSlot(s.id, null, true);
				return;
			}
			if (st.edit) {
				const ta = box.querySelector("#pv-edit");
				if (ta) st.draft = ta.value;
			}
			if (k === "more") st.more = true;
			if (k === "prev") st.slide = Math.max(0, st.slide - 1);
			if (k === "next") st.slide += 1;
			if (k === "goto") st.slide = Number(b.dataset.k);
			paint();
		});

	function aiCtxOf(ta) {
		const s = ta.dataset.slot && AC.byId(S.slots, ta.dataset.slot);
		if (s) return {
			slotId: s.id,
			columnId: AC.slotColumnId(S, s),
			channelId: s.channelId
		};
		const c = ta.dataset.cell && AC.byId(S.cells, ta.dataset.cell);
		return c ? { columnId: c.columnId } : {};
	}
	function aiRange(ta) {
		const v = ta.value;
		let a = ta.selectionStart, b = ta.selectionEnd;
		if (a === b) {
			a = v.lastIndexOf("\n\n", a - 1);
			a = a < 0 ? 0 : a + 2;
			b = v.indexOf("\n\n", b);
			b = b < 0 ? v.length : b;
		}
		while (a < b && /\s/.test(v[a])) a++;
		while (b > a && /\s/.test(v[b - 1])) b--;
		return [a, b];
	}
	function aiReplaceAll(ta, text) {

	function skillBlindExport(kind, o) {
		const items = [];
		if (kind === "fmt") S.slots.filter((s) => s.formatId === o.id).forEach((s) => (s.history || []).forEach((h) => {
			if (h.ai && h.text) items.push({
				text: h.text,
				ref: h.ai.skill || null,
				where: `${s.date} ${s.time}`
			});
		}));
		else S.cells.filter((c) => c.columnId === o.id).forEach((c) => c.gens.forEach((g) => {
			if (g.ai && g.text) items.push({
				text: g.text,
				ref: g.ai.skill || null,
				where: c.id
			});
		}));
		const withS = items.filter((i) => i.ref).slice(-6), without = items.filter((i) => !i.ref).slice(-6);
		if (!withS.length || !without.length) return toast("Cần có cả bài AI viết có Skill và không Skill. Hãy gen vài lần với Skill, rồi tắt Skill gen vài lần nữa.", "bad");
		const all = withS.concat(without).map((i) => ({
			i,
			r: Math.random()
		})).sort((x, y) => x.r - y.r).map((x) => x.i);
		const md = [
			`# So mù · ${o.name}`,
			"",
			"Chấm từng bài 1–5 (đọc đúng, giọng, bố cục, hay) mà chưa mở phần Đáp án ở cuối.",
			"",
			...all.map((i, n) => `## Bài ${n + 1}\n\n${i.text}\n\nĐiểm của bạn: ___\n`),
			"---",
			"",
			"## Đáp án (đừng mở trước khi chấm)",
			"",
			...all.map((i, n) => `- Bài ${n + 1}: ${i.ref ? `có Skill "${i.ref.name}" v${i.ref.version}` : "không Skill"} (${i.where})`)
		].join("\n");
		downloadBytes(`so-mu-${o.id}.md`, new TextEncoder().encode(md), "text/markdown");
	}

	function bindCriteria(box, prefix) {
		const rows = $(`#${prefix}-rows`, box);

			const sum = readCriteria(box, prefix).reduce((s, c) => s + c.weight, 0);
			const el = $(`#${prefix}-sum`, box);
			el.textContent = `Tổng ${sum}`;
			el.style.color = sum === 100 ? "var(--good)" : "var(--bad)";
		};
		box.addEventListener("input", (e) => {
			if (e.target.closest(`#${prefix}-rows`)) upd();
		});
		box.addEventListener("click", (e) => {
			if (e.target.closest(`[data-crit-add="${prefix}"]`)) {

				rows.insertAdjacentHTML("beforeend", critRowHtml(prefix, {
					id: `k${Date.now() % 1e5}${i}`,
					name: "",
					weight: 0
				}, i));
				upd();

      <div><button class="btn" data-act="tpl-add" data-day="1">${icon("plus")} Thêm slot mẫu</button></div>
    </section>`;

			4,
			5,
			6,
			7
		];
		const plus = (d) => `<button class="addslot" data-act="tpl-add" data-day="${d}" aria-label="Thêm slot mẫu ${esc(AC.WEEKDAY_LONG[d])}">${icon("plus")}</button>`;
		const chip = (t) => `<button class="slot" data-act="tpl-slot-edit" data-id="${esc(t.id)}" aria-label="${esc(`${AC.WEEKDAY_LONG[t.weekday]} ${t.time} ${chName(t.channelId)} ${fmtName(t.formatId)}`)}">

      <span class="fmt">${esc(fmtName(t.formatId))}</span>
      <span class="seg-col">${esc(colName(colOf(t)))}</span></button>`;
		return `<div class="tplcal">${`<div class="cal" role="grid" aria-label="Lịch Tuần mẫu">${days.map((d) => `
    <div class="day" role="gridcell"><div class="day-h"><span><b>${AC.WEEKDAY_SHORT[d]}</b></span>${plus(d)}</div>

			const ds = list.filter((t) => t.weekday === d);

	ACTIONS["tpl-slot-edit"] = (el) => {

		if (!t) return;
		const box = openLayer(`<h2>Sửa slot mẫu</h2>
    <div class="fgrid">
      <div class="field"><label for="ts-d">Thứ</label><select id="ts-d">${[
			1,
			2,

    <div class="actions"><button class="btn danger" data-x="del" style="margin-right:auto">Xóa slot</button><button class="btn" data-x="no">Hủy</button><button class="btn primary" data-x="save">Lưu</button></div>`, "dialog");
		const colHint = () => {
			const f = AC.byId(S.formats, $("#ts-f", box).value);
			$("#ts-col", box).textContent = `Cột: ${f ? colName(f.columnId) : "(chưa có Format)"}`;
		};
		box.addEventListener("change", (e) => {
			if (e.target.id === "ts-c") $("#ts-f", box).innerHTML = formatOptions(e.target.value, "");
			if (e.target.id === "ts-c" || e.target.id === "ts-f") colHint();
		});
		box.addEventListener("click", (e) => {
			const b = e.target.closest("[data-x]");
			if (!b) return;
			if (b.dataset.x === "no") return closeLayer();
			if (b.dataset.x === "del") {
				tpl.slots = tpl.slots.filter((x) => x.id !== t.id);
				closeLayer();
				return commit("Đã xóa slot mẫu.");

			const time = $("#ts-t", box).value, fid = $("#ts-f", box).value;
			if (!AC.isValidTime(time)) {
				$("#ts-err", box).textContent = "Giờ không hợp lệ.";

			if (!fid) {
				$("#ts-err", box).textContent = "Kênh này chưa có Format. Chọn kênh khác hoặc tạo Format trước.";

				weekday: Number($("#ts-d", box).value),
				time,
				channelId: $("#ts-c", box).value,
				formatId: fid
			});
			closeLayer();

		const el = e.target.closest && e.target.closest("[data-drag]");
		if (!el) return;
		dragSlotId = el.dataset.drag;
		Object.keys(dropPlan).forEach((k) => delete dropPlan[k]);
		try {
			e.dataTransfer.setData("text/plain", dragSlotId);
			e.dataTransfer.effectAllowed = "move";

		el.classList.add("dragging");
		document.body.classList.add("drag-slot");
	});

		document.querySelectorAll(".dragging").forEach((x) => x.classList.remove("dragging"));
	});
	document.addEventListener("dragover", (e) => {

		const p = dropPlan[d] || (dropPlan[d] = AC.moveSlotCheck(S, dragSlotId, d));

	CHANGES["img-upload"] = (el) => {

			if (file.size > vidMax()) return toast(`Video quá lớn (tối đa ${vidMax() / 1048576} MB vì lưu trong trình duyệt).`, "bad");
			const vr = new FileReader();

			vr.onload = () => {
				const r = AC.uploadSlotImage(S, id, i, {

				});
				if (!r.ok) return toast(r.error, "bad");

			};

		if (!/^image\//.test(file.type)) return toast("Tệp không phải ảnh hoặc video (PNG, JPG, WebP, GIF, MP4, WebM).", "bad");
		if (file.size > IMG_MAX_BYTES) return toast("Ảnh quá lớn (tối đa 15 MB).", "bad");
		const reader = new FileReader();
		reader.onerror = () => toast("Không đọc được tệp ảnh.", "bad");
		reader.onload = () => {
			const img = new Image();
			img.onerror = () => toast("Không mở được ảnh này.", "bad");
			img.onload = () => {
				const k = Math.min(1, IMG_MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
				const w = Math.max(1, Math.round(img.naturalWidth * k)), h = Math.max(1, Math.round(img.naturalHeight * k));
				let src = String(reader.result);
				try {
					const c = document.createElement("canvas");
					c.width = w;
					c.height = h;
					const g = c.getContext("2d");
					g.fillStyle = "#fff";
					g.fillRect(0, 0, w, h);
					g.drawImage(img, 0, 0, w, h);
					src = c.toDataURL("image/jpeg", .85);
				} catch (e) {}
				const r = AC.uploadSlotImage(S, id, i, {
					src,
					name: file.name,
					w,
					h
				});
				if (!r.ok) return toast(r.error, "bad");
				save();
				render();
				if (pvRefresh && pvRefresh(id)) {} else openSlot(id);
				toast(`Đã tải ảnh lên, thành phiên bản ${r.version}.`);
			};
			img.src = String(reader.result);
		};
		reader.readAsDataURL(file);
	};

		const k = Math.max(w / iw, h / ih), sw = w / k, sh = h / k;

		g.beginPath();

		g.arcTo(x + w, y + h, x, y + h, r);

	function fitLines(g, text, maxW, size, lines, weight) {
		const words = String(text || "").replace(/\s+/g, " ").trim().split(" ").filter(Boolean);
		if (!words.length) return {
			size,
			rows: []
		};
		const wrap = (sz) => {
			g.font = `${weight} ${sz}px ${FRAME_FONT}`;
			const rows = [];
			let cur = "";
			words.forEach((w) => {
				const t = cur ? cur + " " + w : w;
				if (g.measureText(t).width <= maxW || !cur) cur = t;
				else {
					rows.push(cur);
					cur = w;
				}
			});
			if (cur) rows.push(cur);
			return rows;
		};
		let sz = size, rows = wrap(sz);
		while (rows.length > lines && sz > size * .6) {
			sz = Math.round(sz * .92);
			rows = wrap(sz);
		}
		if (rows.length > lines) {
			rows = rows.slice(0, lines);
			let last = rows[lines - 1];
			while (last && g.measureText(last + "…").width > maxW) last = last.replace(/\s*\S+$/, "");
			rows[lines - 1] = (last || rows[lines - 1]) + "…";
		}
		return {
			size: sz,
			rows

	CHANGES["frd-file"] = (el) => {
		const file = el.files && el.files[0];

		if (!file || !d) return;
		if (!/^image\/(png|webp)$/.test(file.type)) return toast("Frame cần là ảnh PNG (hoặc WebP) có nền trong suốt.", "bad");
		const rd = new FileReader();
		rd.onload = async () => {
			try {
				const img = await loadImg(rd.result);
				const [W, H] = AC.FRAME_RATIOS[d.ratio];
				const c = document.createElement("canvas");
				c.width = W;
				c.height = H;
				c.getContext("2d").drawImage(img, 0, 0, W, H);
				d.src = c.toDataURL("image/png");
				if (!d.name) d.name = file.name.replace(/\.\w+$/, "").slice(0, 60);
				if (Math.abs(img.naturalWidth / img.naturalHeight - W / H) > .02) toast(`Ảnh có tỉ lệ khác ${AC.FRAME_RATIO_LABEL[d.ratio]}: đã kéo về đúng khổ ${W}×${H}.`);
				render();
			} catch (e) {

		};

			const z = a + (m[2] != null ? m[2] : m[4]).length + 2;
			if (hide[a] || hide[z - 1] || bold[a]) continue;

    ${tile("Tỷ lệ tương tác", t.reach ? fmtPct(t.engRate) : "—", t.engRate, P && P.engRate, "Tương tác ÷ Tiếp cận/xem")}
    ${tile("Đăng đúng giờ", t.posts ? fmtPct(t.onTime / t.posts) : "—", null, null, "Đăng trong 30 phút sau giờ của slot")}
    ${tile("Đúng bản đã chốt", t.posts ? fmtPct(t.asConfirmed / t.posts) : "—", null, null, "Bài đăng đúng nội dung đã chốt")}
  </div>`;
	}
	function rpBars(items, title) {
		const max = Math.max(1, ...items.map((i) => i.value)), W = 640, H = 180, gap = 14, bw = Math.min(64, Math.max(8, (W - gap * (items.length - 1)) / items.length));
		const x0 = (W - (bw * items.length + gap * (items.length - 1))) / 2;
		const top = items.reduce((a, b) => b.value > a.value ? b : a, items[0] || { value: 0 });
		return `<figure class="rchart"><figcaption class="small muted">${esc(title)}</figcaption>
    <svg viewBox="0 0 ${W} 206" role="img" aria-label="${esc(title)}">
      <line x1="0" x2="${W}" y1="${H}" y2="${H}" class="rc-base"/>
      ${items.map((it, i) => {
			const h = it.value ? Math.max(3, Math.round(it.value / max * 162)) : 0;
			const x = x0 + i * (bw + gap);
			const r = Math.min(4, bw / 2, h);
			return `<g class="rc-bar"><title>${esc(it.label)}: ${esc(fmtNum(it.value))} tiếp cận/xem · ${esc(fmtNum(it.eng || 0))} tương tác · ${it.posts || 0} bài</title>
          <rect x="${x}" y="0" width="${bw}" height="${H}" class="rc-hit"/>
          ${h ? `<path d="M${x},${H} V${H - h + r} Q${x},${H - h} ${x + r},${H - h} H${x + bw - r} Q${x + bw},${H - h} ${x + bw},${H - h + r} V${H} Z" class="rc-fill"/>` : ""}
          ${it === top && it.value ? `<text x="${x + bw / 2}" y="${H - h - 5}" text-anchor="middle" class="rc-val">${esc(fmtNum(it.value))}</text>` : ""}
          <text x="${x + bw / 2}" y="197" text-anchor="middle" class="rc-lab">${esc(it.short || it.label)}</text></g>`;
		}).join("")}
    </svg></figure>`;
	}
	function rpTable(title, entries, nameOf) {
		if (!entries.length) return "";
		return `<section class="cfg-sec"><div class="cfg-h"><h3>${esc(title)}</h3></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>${esc(title.replace(/^Theo /, ""))}</th><th class="num">Bài</th><th class="num">Tiếp cận/xem</th><th class="num">Tương tác</th><th class="num">Tỷ lệ</th></tr></thead><tbody>
    ${entries.sort((a, b) => b[1].reach - a[1].reach).map(([k, b]) => `<tr><td>${nameOf(k)}</td><td class="num mono">${b.posts}</td><td class="num mono">${esc(fmtNum(b.reach))}</td><td class="num mono">${esc(fmtNum(b.eng))}</td><td class="num mono">${b.reach ? esc(fmtPct(b.engRate)) : "—"}</td></tr>`).join("")}
  </tbody></table></div></section>`;
	}
	function rpChannelCards(st) {
		const ids = S.channels.map((c) => c.id).filter((id) => st.byChannel[id]);
		if (!ids.length) return "";
		return `<div class="rcards">${ids.map((id) => {
			const b = st.byChannel[id];
			const sample = st.rows.find((r) => r.slot.channelId === id).slot;
			const defs = AC.metricDefs(S, sample).filter((d) => b.values[d.k] != null);
			const p = AC.channelPublish(S, id);
			return `<section class="rcard"><header>${chTag(id)}<span class="small faint">${b.posts} bài · ${p.mode === "auto" ? `tự đăng qua ${esc(VIA_LABEL[p.via])}` : "đăng tay"}</span></header>
      <dl>${defs.map((d) => `<div><dt>${esc(d.l)}</dt><dd class="mono">${esc(d.k === "watchHours" ? String(Math.round(b.values[d.k] * 10) / 10).replace(".", ",") : fmtNum(b.values[d.k]))}</dd></div>`).join("")}
      <div><dt>Tỷ lệ tương tác</dt><dd class="mono">${b.reach ? esc(fmtPct(b.engRate)) : "—"}</dd></div></dl>
      ${b.tracked < b.posts ? `<p class="small faint">${b.posts - b.tracked} bài chưa có số liệu</p>` : ""}</section>`;
		}).join("")}</div>`;
	}
	function rpTop(st) {
		if (!st.top.length) return "";
		return `<section class="cfg-sec"><div class="cfg-h"><h3>Top bài theo tương tác</h3></div><div class="list">${st.top.map((r, i) => `<button class="li" data-act="open-slot" data-id="${esc(r.slot.id)}"><span class="mono">${i + 1}. ${esc(AC.dmy(r.slot.date))} ${esc(r.slot.time)}</span><span>${chTag(r.slot.channelId)} <span class="muted">· ${esc(fmtName(r.slot.formatId))}</span></span><span class="mono small">${esc(fmtNum(r.reach))} · <b>${esc(fmtNum(r.eng))}</b></span></button>`).join("")}</div></section>`;
	}
	function rpPosts(st) {
		if (!st.rows.length) return "";
		const label = {
			ok: "",
			nolink: "Chưa có link",
			none: "Không lấy số liệu",
			wait: "Chờ số liệu"
		};
		return `<section class="cfg-sec"><div class="cfg-h"><h3>Bài đã đăng</h3><span class="small faint cfg-r">${st.rows.length} bài</span></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Ngày giờ</th><th>Kênh · Format</th><th>Cách đăng</th><th class="num">Tiếp cận/xem</th><th class="num">Tương tác</th></tr></thead><tbody>
    ${st.rows.slice().sort((a, b) => (a.slot.date + a.slot.time).localeCompare(b.slot.date + b.slot.time)).map((r) => `<tr class="clickrow" data-act="open-slot" data-id="${esc(r.slot.id)}"><td class="mono">${esc(AC.dmy(r.slot.date))} ${esc(r.slot.time)}</td><td>${chTag(r.slot.channelId)} · ${esc(fmtName(r.slot.formatId))}</td><td class="small">${r.slot.pub.mode === "auto" ? "Tự động" : "Thủ công"}${r.slot.pub.url ? "" : " · <span style=\"color:var(--warn)\">chưa có link</span>"}</td><td class="num mono">${r.status === "ok" ? esc(fmtNum(r.reach)) : `<span class="faint small">${esc(label[r.status])}</span>`}</td><td class="num mono">${r.status === "ok" ? esc(fmtNum(r.eng)) : ""}</td></tr>`).join("")}
  </tbody></table></div></section>`;
	}
	RENDERERS.report = () => {
		const rg = rpRange();
		const ch = view.rpCh;
		const st = AC.reportStats(S, {
			from: rg.from,
			to: rg.to,
			channels: ch
		});
		const prev = rg.prev ? AC.reportStats(S, {
			from: rg.prev.from,
			to: rg.prev.to,
			channels: ch
		}) : null;
		const usedCh = S.channels.map((c) => c.id).filter((id) => S.slots.some((s) => s.channelId === id && s.state === "PUBLISHED"));
		let chart = "";
		if (view.rpTab === "week") chart = rpBars([
			1,
			2,
			3,
			4,
			5,
			6,
			7
		].map((d) => {
			const date = AC.addDays(rg.from, d - 1);
			const b = st.byDay[date] || {};
			return {
				label: `${AC.WEEKDAY_LONG[d]} ${AC.dmy(date)}`,
				short: `${AC.WEEKDAY_SHORT[d]} ${AC.dmy(date)}`,
				value: b.reach || 0,
				eng: b.eng,
				posts: b.posts
			};
		}), "Tiếp cận/xem theo ngày");
		else {
			const weeks = view.rpTab === "month" ? (() => {
				const out = [];
				for (let wk = AC.mondayOf(rg.from); wk <= rg.to; wk = AC.addDays(wk, 7)) out.push(wk);
				return out;
			})() : Object.keys(st.byWeek).sort();
			if (weeks.length) chart = rpBars(weeks.map((wk) => {
				const b = st.byWeek[wk] || {};
				return {
					label: `Tuần ${AC.weekLabelOf(wk).range}`,
					short: `T ${AC.dmy(wk)}`,
					value: b.reach || 0,
					eng: b.eng,
					posts: b.posts
				};
			}), "Tiếp cận/xem theo tuần");
		}
		const empty = !st.total.posts;
		return `<div class="page-head"><div><span class="eyebrow">Report kênh · số liệu mô phỏng</span><h1>${esc(rg.label)}</h1><p class="sub">${view.rpTab === "overview" ? "Mọi bài đã đăng." : `Đổi ${view.rpTab === "week" ? "tuần" : "tháng"} bằng mũi tên tuần ở thanh trên.`} Số liệu lấy mốc mới nhất (1 giờ, 24 giờ hoặc 7 ngày) của từng bài.</p></div></div>
    <section class="work">
      <div class="week-tools">
        <div class="seg" role="group" aria-label="Kỳ báo cáo">${RP_TABS.map(([id, l]) => `<button aria-pressed="${view.rpTab === id}" data-act="rp-tab" data-t="${id}">${l}</button>`).join("")}</div>
        <div class="filters" role="group" aria-label="Lọc theo kênh">${usedCh.length ? "<span class=\"small muted\">Kênh:</span>" : ""}${usedCh.map((id) => `<button class="fchip" aria-pressed="${ch.includes(id)}" data-act="rp-ch" data-ch="${esc(id)}">${chTag(id)}</button>`).join("")}${ch.length ? "<button class=\"linkbtn small\" data-act=\"rp-ch-clear\">Bỏ lọc</button>" : ""}</div>
      </div>
      ${rpTiles(st.total, prev, rg.prevLabel)}
      ${empty ? `<div class="note">Chưa có bài đã đăng trong kỳ này. Xác nhận lịch ở Dashboard rồi tua giờ demo (bấm giờ ở thanh trên) để thấy bài tự đăng và số liệu.</div>` : chart}
    </section>
    ${empty ? "" : `<div class="rgrid">${rpChannelCards(st)}${rpTop(st)}
      ${view.rpTab !== "week" ? rpTable("Theo Cột", Object.entries(st.byColumn), (k) => k ? esc(colName(k)) : "<span class=\"faint\">Không Cột</span>") + rpTable("Theo Format", Object.entries(st.byFormat), (k) => esc(fmtFull(k))) : rpPosts(st)}
      ${view.rpTab === "overview" ? "" : view.rpTab === "month" ? rpPosts(st) : rpTable("Theo Cột", Object.entries(st.byColumn), (k) => k ? esc(colName(k)) : "<span class=\"faint\">Không Cột</span>")}</div>`}`;
	};
	ACTIONS["rp-tab"] = (el) => {
		view.rpTab = el.dataset.t;
		render();
	};
	ACTIONS["rp-ch"] = (el) => {
		const id = el.dataset.ch;
		view.rpCh = view.rpCh.includes(id) ? view.rpCh.filter((x) => x !== id) : [...view.rpCh, id];
		render();
	};
	ACTIONS["rp-ch-clear"] = () => {
		view.rpCh = [];
		render();
	};
	//#endregion
	//#region src/ui/99-boot.js
	document.addEventListener("click", (e) => {
		const el = e.target.closest("[data-act]");
		if (!el || el.disabled) return;
		const fn = ACTIONS[el.dataset.act];
		if (fn) {
			e.preventDefault();
			fn(el, e);
		}
	});
	document.addEventListener("change", (e) => {
		const el = e.target.closest("[data-change]");
		if (el && CHANGES[el.dataset.change]) CHANGES[el.dataset.change](el, e);
	});
	document.addEventListener("input", (e) => {
		const el = e.target.closest("[data-input]");
		if (el && INPUTS[el.dataset.input]) INPUTS[el.dataset.input](el, e);
	});
	document.addEventListener("keydown", (e) => {
		if (e.key === "Escape" && layerStack.length) closeLayer();
	});
	var oldDataKey = "";
	ACTIONS["show-old-data"] = () => {
		openLayer(`<h2>Dữ liệu cũ</h2><p class="small muted">Sao chép để lưu lại nếu cần. Ứng dụng v2.8 không đọc được bản này.</p>
    <textarea readonly class="mono small" style="width:100%;min-height:240px">${esc(store.get(oldDataKey) || "")}</textarea>
    <div class="actions"><button class="btn" data-act="copy-old-data">Sao chép</button><button class="btn primary" data-act="close-layer">Đóng</button></div>`, "dialog");
	};
	ACTIONS["copy-old-data"] = () => copyText(store.get(oldDataKey) || "");
	window.__AC_S = () => S;
	(async function boot() {
		const theme = store.get("autocontent.theme");
		if (theme === "dark" || theme === "light") document.documentElement.setAttribute("data-theme", theme);
		const raw = store.get(AC.STORAGE_KEY);
		try {
			await mediaOpen();
			setMediaOk(true);
		} catch (e) {
			setMediaOk(false);
		}
		const res = AC.loadStateFromRaw(raw);
		if (res.status === "ok") {
			setS(res.state);
			if (raw.includes("\"idb:")) try {
				const h = await mediaHydrate(S);
				if (h.missing) setTimeout(() => toast(`${h.missing} ảnh/video không còn trong bộ nhớ trình duyệt, đã thay bằng ô xám. Khôi phục từ bản Sao lưu nếu cần.`, "bad"), 300);
				mediaGc(h.refs);
			} catch (e) {
				setTimeout(() => toast("Không đọc được ảnh, video đã cất trong trình duyệt.", "bad"), 300);
			}
			else if (mediaOk) mediaGc(/* @__PURE__ */ new Set());
		} else if (res.status === "corrupt") {
			store.set(AC.STORAGE_KEY + "-rescue", raw);
			setS(AC.emptyState());
			S.ui.weekStart = AC.mondayOf(nowDate());
			view.screen = "setup";
			view.setupTab = "backup";
			view.banner = `Dữ liệu đã lưu bị hỏng (${esc(res.error)}). Bản thô đã được cứu sang khóa "${esc(AC.STORAGE_KEY)}-rescue" và ứng dụng mở trống an toàn. Bạn có thể nạp dữ liệu demo hoặc khôi phục từ bản sao lưu.`;
			save();
		} else if (res.status === "old") {
			const tag = res.label === "v2.6" ? "-v26" : "-v27";
			oldDataKey = AC.STORAGE_KEY + tag;
			store.set(oldDataKey, raw);
			setS(AC.buildSeed());
			save();
			view.banner = `Ứng dụng đã chuyển sang mô hình Topic → Matrix → Chia bài (đặc tả v2.8) nên dữ liệu cũ (${esc(res.label)}, ${esc(res.version)}) không dùng tiếp được. Bản cũ được cất trong trình duyệt ở khóa "${esc(oldDataKey)}"; dữ liệu demo mới đã được nạp. <button class="linkbtn" data-act="show-old-data">Xem bản cũ</button>`;
		} else {
			setS(AC.buildSeed());
			save();
			setTimeout(() => toast("Lần đầu mở: đã nạp dữ liệu demo Nói Được English."), 300);
		}
		if (!clockOff()) AC.clockTick(S, Date.now());
		if (AC.runScheduler(S).published.length || AC.syncMetrics(S)) save();
		else save();
		render();
		if (!clockOff()) setInterval(liveTick, window.__AC_TICK_MS || 3e4);
	})();
	//#endregion
})();

</script>
