<title>AutoContent Content Matrix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400;1,700&family=IBM+Plex+Mono:wght@400;500&family=Roboto:ital,wght@0,400;0,700;1,400;1,700&family=Montserrat:ital,wght@0,400;0,700;1,400;1,700&family=Oswald:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Dancing+Script:wght@400;700&display=swap">
<style>
/* Bố cục: bàn điều phối tuần — thanh bên gọn, lịch là vùng chính, "việc tiếp theo" là dải nổi duy nhất. */
:root {
  --bg: #f2f4f6; --surface: #ffffff; --surface-2: #e8ecf0; --line: #d3dae2; --line-strong: #9eabb9;
  --ink: #16202a; --ink-2: #4a5765; --ink-3: #6f7c8a;
  --accent: #2741b0; --accent-soft: #e4e8fa; --accent-ink: #ffffff;
  --mark: #f3c24c; --mark-soft: #fdf1cf; --mark-ink: #3a2a00;
  --warn: #8a4b00; --warn-soft: #fff1d9; --bad: #b42318; --bad-soft: #fde8e6; --good: #1d6f48; --good-soft: #e1f3e9;
  --ch-fb: #2f68d8; --ch-ig: #b2306f; --ch-tt: #0d7f80; --ch-th: #45454f;
  /* Chữ (mục 10.26): một font Be Vietnam Pro cho cả chữ thường và tiêu đề; mono chỉ cho ô sửa Markdown, mẫu tệp. Thang cỡ 7 bậc */
  --f-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --fs-1: 12px; --fs-2: 13px; --fs-3: 14px; --fs-4: 15px; --fs-5: 18px; --fs-6: 22px; --fs-7: 28px;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r-s: 6px; --r-m: 10px;
  --shadow: 0 1px 2px rgb(16 24 40 / 6%), 0 4px 16px rgb(16 24 40 / 6%);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11161c; --surface: #19212a; --surface-2: #222c37; --line: #2f3b48; --line-strong: #5a6a7b;
  --ink: #e6ebf0; --ink-2: #b0bccb; --ink-3: #8f9cab;
  --accent: #8ea2ff; --accent-soft: #232c52; --accent-ink: #0d1330;
  --mark: #f3c24c; --mark-soft: #3a2f12; --mark-ink: #fff3cf;
  --warn: #ffc56b; --warn-soft: #3a2a10; --bad: #ff8f84; --bad-soft: #3e1a17; --good: #7fd6a6; --good-soft: #15352a;
  --ch-fb: #79a5ff; --ch-ig: #f17ab6; --ch-tt: #4fd0cf; --ch-th: #c2c2cf;
  --shadow: 0 1px 2px rgb(0 0 0 / 40%), 0 6px 20px rgb(0 0 0 / 30%);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #11161c; --surface: #19212a; --surface-2: #222c37; --line: #2f3b48; --line-strong: #5a6a7b;
  --ink: #e6ebf0; --ink-2: #b0bccb; --ink-3: #8f9cab;
  --accent: #8ea2ff; --accent-soft: #232c52; --accent-ink: #0d1330;
  --mark: #f3c24c; --mark-soft: #3a2f12; --mark-ink: #fff3cf;
  --warn: #ffc56b; --warn-soft: #3a2a10; --bad: #ff8f84; --bad-soft: #3e1a17; --good: #7fd6a6; --good-soft: #15352a;
  --ch-fb: #79a5ff; --ch-ig: #f17ab6; --ch-tt: #4fd0cf; --ch-th: #c2c2cf;
  --shadow: 0 1px 2px rgb(0 0 0 / 40%), 0 6px 20px rgb(0 0 0 / 30%);
  color-scheme: dark;
}

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: var(--fs-3); line-height: 1.5; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--f-body); font-weight: 700; line-height: 1.25; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h3 { font-weight: 600; }
h1 { font-size: var(--fs-7); } h2 { font-size: var(--fs-6); } h3 { font-size: var(--fs-4); }
p { margin: 0; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.mono, .t { font-variant-numeric: tabular-nums; } /* giờ, số: chữ số đều cột của font chính */
.muted { color: var(--ink-2); } .faint { color: var(--ink-3); }
.small { font-size: var(--fs-1); }
.eyebrow { font-size: var(--fs-1); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Khung ---------- */
.app { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100%; }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; display: flex; flex-direction: column; gap: 20px; padding: 18px 12px; border-right: 1px solid var(--line); background: var(--surface); }
.brandmark { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.brandmark strong { display: block; font-family: var(--f-body); font-size: var(--fs-5); }
.brandmark small { color: var(--ink-3); font-size: var(--fs-1); }
.bm-dot { width: 26px; height: 26px; border-radius: 7px; background: conic-gradient(from 45deg, var(--accent) 0 25%, var(--mark) 0 50%, var(--accent) 0 75%, var(--surface-2) 0); flex: none; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 8px 10px; border: 0; border-radius: var(--r-s); background: none; text-align: left; cursor: pointer; color: var(--ink-2); font-weight: 500; }
.nav button:hover { background: var(--surface-2); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav svg, .tabbar svg { width: 18px; height: 18px; flex: none; }
.rail-foot { margin-top: auto; display: grid; gap: 6px; padding: 0 8px; }
.main-col { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 24px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.main { padding: 20px 24px 40px; display: grid; gap: 20px; align-content: start; min-width: 0; }
.tabbar { display: none; }

.weekpick { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; min-width: 0; }
.weekpick select { min-height: 36px; padding: 4px 8px; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--surface); max-width: 230px; }
.topbar .spacer { flex: 1; }
.status-chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: var(--fs-1); font-weight: 600; border: 1px solid var(--line); background: var(--surface); white-space: nowrap; }
.status-chip.locked { background: var(--good-soft); color: var(--good); border-color: transparent; }
.status-chip.reopened { background: var(--warn-soft); color: var(--warn); border-color: transparent; }

/* ---------- Nút ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 6px 14px; border-radius: var(--r-s); border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--line-strong); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); }
.btn.ghost { border-color: transparent; background: none; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { min-height: 30px; padding: 3px 10px; font-size: var(--fs-2); }
.btn.icon { width: 36px; padding: 0; }
.btn svg { width: 16px; height: 16px; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }

/* ---------- Bề mặt ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 16px; min-width: 0; }
.panel > header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; }
.page-head .sub { color: var(--ink-2); margin-top: 4px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 16px; }
.stack { display: grid; gap: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.note { padding: 10px 12px; border-radius: var(--r-s); background: var(--surface-2); color: var(--ink-2); font-size: var(--fs-2); }
.note.warn { background: var(--warn-soft); color: var(--warn); }
.note.bad { background: var(--bad-soft); color: var(--bad); }
.note.good { background: var(--good-soft); color: var(--good); }
.empty { padding: 28px 16px; text-align: center; color: var(--ink-2); border: 1px dashed var(--line-strong); border-radius: var(--r-m); display: grid; gap: 10px; justify-items: center; }

/* Dải việc tiếp theo: điểm nhấn duy nhất của mỗi màn hình */
.nextband { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 14px 16px; border-radius: var(--r-m); background: var(--mark-soft); border: 1px solid color-mix(in srgb, var(--mark) 55%, transparent); }
.nextband .what { flex: 1; min-width: 200px; }
.nextband .what strong { display: block; font-family: var(--f-body); font-size: var(--fs-5); }
.nextband .what span { color: var(--ink-2); font-size: var(--fs-2); }
.nextband .btn.primary { background: var(--ink); border-color: var(--ink); color: var(--bg); }

/* ---------- Thanh tiến độ ---------- */
.progress { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; }
.pstep { position: relative; border: 0; background: none; text-align: left; padding: 8px 2px 0; cursor: pointer; min-width: 0; color: var(--ink-3); }
.pstep::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px; border-radius: 2px; background: var(--surface-2); }
.pstep.done::before { background: var(--good); }
.pstep.cur::before { background: var(--accent); }
.pstep .pn { font-size: var(--fs-1); font-variant-numeric: tabular-nums; }
.pstep .pl { display: block; font-size: var(--fs-1); font-weight: 500; line-height: 1.25; overflow-wrap: anywhere; }
.pstep.cur { color: var(--ink); } .pstep.cur .pl { font-weight: 700; }
.pstep.done { color: var(--ink-2); }
.pstep .pr { display: block; font-size: var(--fs-1); color: var(--warn); line-height: 1.2; overflow-wrap: anywhere; }
.progress-compact { display: none; }

/* ---------- Kênh, trạng thái ---------- */
.ch { display: inline-flex; align-items: center; gap: 5px; font-size: var(--fs-1); font-weight: 600; white-space: nowrap; }
/* Icon nền tảng (mục 10.25): màu thương hiệu; Threads, TikTok (logo đen) và Blog theo màu chữ để chế độ tối vẫn rõ */
.ch .pfi { width: 14px; height: 14px; flex: none; color: var(--pfc, var(--ink-2)); }
.pf-facebook { --pfc: #0866FF; } .pf-instagram { --pfc: #FF0069; } .pf-youtube { --pfc: #FF0000; }
.pf-threads, .pf-tiktok { --pfc: var(--ink); }
.slot .top .ch .chn, .dl-slots .ch .chn { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.slot .top .ch .pfi { width: 16px; height: 16px; }
.st { display: inline-flex; align-items: center; gap: 3px; font-size: var(--fs-1); font-weight: 500; letter-spacing: .01em; line-height: 1.5; padding: 0 6px; border-radius: 999px; white-space: nowrap; }
.st-need { background: var(--warn-soft); color: var(--warn); }
.st-bad { background: var(--bad-soft); color: var(--bad); }
.st-ok { background: var(--accent-soft); color: var(--accent); }
.st-done { background: var(--good-soft); color: var(--good); }
.st-off { background: var(--surface-2); color: var(--ink-2); }

/* ---------- Lịch tuần ---------- */
.week-tools { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r-s); overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 6px 12px; min-height: 34px; cursor: pointer; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 600; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.fchip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px; min-height: 30px; cursor: pointer; }
.fchip[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surface); overflow: hidden; }
.day { min-width: 0; border-right: 1px solid var(--line); display: flex; flex-direction: column; }
.day:last-child { border-right: 0; }
.day-h { display: flex; align-items: center; justify-content: space-between; gap: 4px; padding: 8px 8px 8px 10px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.day-h b { font-family: var(--f-body); font-size: var(--fs-3); }
.day-h .t { font-size: var(--fs-1); color: var(--ink-2); }
.day.today .day-h { background: var(--mark-soft); }
.day-b { display: grid; gap: 6px; padding: 8px; align-content: start; min-height: 220px; }
.addslot { width: 28px; height: 28px; min-height: 28px; border-radius: 6px; border: 1px dashed var(--line-strong); background: var(--surface); cursor: pointer; display: inline-grid; place-items: center; color: var(--ink-2); }
.addslot:hover { border-style: solid; color: var(--accent); border-color: var(--accent); }
.slot { display: grid; gap: 3px; text-align: left; padding: 7px 8px; border-radius: var(--r-s); border: 1px solid var(--line); background: var(--surface); cursor: pointer; min-width: 0; }
.slot:hover { border-color: var(--line-strong); box-shadow: var(--shadow); }
.slot .top { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
.slot .top .ch { margin-left: auto; }
.slot .t { font-size: var(--fs-1); font-weight: 600; }
.slot .fmt { font-size: var(--fs-1); color: var(--ink-2); overflow-wrap: anywhere; line-height: 1.3; }
.slot .seg-col { font-size: var(--fs-1); color: var(--ink-2); letter-spacing: .01em; font-style: italic; line-height: 1.3; }
.slot.need { border-color: var(--warn); border-width: 1.5px; }
.slot.done { opacity: .72; background: var(--surface-2); }
.slot.done:hover { opacity: 1; }
.daylist { display: none; }

/* Lịch tháng */
.month { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--r-m); overflow: hidden; background: var(--surface); }
.month .mh { padding: 6px 8px; font-size: var(--fs-1); font-weight: 600; color: var(--ink-2); background: var(--surface-2); border-bottom: 1px solid var(--line); }
.mday { min-height: 78px; padding: 6px 8px; border-top: 1px solid var(--line); border-right: 1px solid var(--line); display: grid; align-content: start; gap: 4px; background: none; text-align: left; cursor: pointer; border-left: 0; border-bottom: 0; }
.mday:nth-child(7n) { border-right: 0; }
.mday.out { color: var(--ink-3); background: color-mix(in srgb, var(--surface-2) 45%, transparent); }
.mday.sel { background: var(--accent-soft); }
.mday .d { font-size: var(--fs-1); font-variant-numeric: tabular-nums; }
.mday .c { font-size: var(--fs-1); color: var(--ink-2); }
.mday .c b { color: var(--ink); }
.mday:disabled { cursor: default; }

/* Chỉ số */
.kchips { display: flex; align-items: center; gap: 6px 8px; flex-wrap: wrap; }
.kchip { font-size: var(--fs-1); padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.kchip b { color: var(--ink); font-variant-numeric: tabular-nums; }
.kchip.late { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.kchip.late b { color: var(--bad); }
.late-list { margin-top: 10px; }
.late-list summary { cursor: pointer; font-size: var(--fs-2); color: var(--bad); min-height: 32px; display: flex; align-items: center; }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.kpi { padding: 12px; border-radius: var(--r-s); background: var(--surface-2); }
.kpi .v { font-family: var(--f-body); font-size: var(--fs-7); font-variant-numeric: tabular-nums; }
.kpi .l { font-size: var(--fs-1); color: var(--ink-2); }

/* Danh sách */
.list { display: grid; }
.li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; cursor: pointer; }
.li:last-child { border-bottom: 0; }
.li:hover { background: var(--surface-2); }
.li .t { font-weight: 600; }

/* Cột của tuần */
.colchips { display: flex; gap: 6px; flex-wrap: wrap; }
.colchip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 6px 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: var(--fs-2); }
.colchip button { width: 24px; height: 24px; border-radius: 999px; border: 0; background: var(--surface-2); cursor: pointer; line-height: 1; }
.colchip.add { border-style: dashed; padding-right: 10px; cursor: pointer; }

/* ---------- Content (chỉ đọc ở R1′) ---------- */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 10px 14px; min-height: 44px; cursor: pointer; color: var(--ink-2); border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 500; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.ideas { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 12px; }
.idea { display: grid; gap: 8px; align-content: start; }
.idea h3 { font-size: var(--fs-5); }
.cite { font-size: var(--fs-1); color: var(--ink-2); border-left: 2px solid var(--line-strong); padding-left: 8px; }
.matrix-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surface); }
.matrix { display: grid; min-width: 880px; }
.matrix .mc { padding: 8px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); min-width: 0; }
.matrix .mhd { background: var(--surface-2); font-weight: 600; font-size: var(--fs-1); }
.matrix .mrow { background: var(--surface-2); font-size: var(--fs-2); }
.cellbtn { width: 100%; display: grid; gap: 4px; text-align: left; border: 1px solid var(--line); border-radius: var(--r-s); padding: 8px; background: var(--surface); cursor: pointer; min-height: 72px; align-content: start; }
.cellbtn:hover { box-shadow: var(--shadow); }
.cellbtn.need { border-color: var(--warn); border-width: 1.5px; }
.cellbtn .ex { font-size: var(--fs-1); color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.mcards { display: none; }
table.tbl { width: 100%; border-collapse: collapse; font-size: var(--fs-2); }
.tbl th, .tbl td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { font-size: var(--fs-1); color: var(--ink-2); font-weight: 600; background: var(--surface-2); }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surface); }

/* ---------- Ngăn bên / hộp thoại ---------- */
.layer { position: fixed; inset: 0; z-index: 50; pointer-events: none; }
.scrim { position: absolute; inset: 0; background: rgb(10 16 24 / 42%); pointer-events: auto; }
.drawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--surface); box-shadow: var(--shadow); display: flex; flex-direction: column; pointer-events: auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.drawer > header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
.drawer .body { overflow-y: auto; padding: 16px 18px 24px; display: grid; gap: 16px; align-content: start; }
.dialog { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(480px, calc(100% - 32px)); max-height: calc(100% - 48px); overflow-y: auto; background: var(--surface); border-radius: var(--r-m); box-shadow: var(--shadow); padding: 20px; display: grid; gap: 14px; pointer-events: auto; }
.dialog .actions, .drawer .actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.toasts { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; width: min(440px, calc(100% - 32px)); pointer-events: none; }
.toast { background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: var(--r-s); box-shadow: var(--shadow); font-size: var(--fs-2); }

/* ---------- Biểu mẫu ---------- */
.field { display: grid; gap: 4px; min-width: 0; }
.field > label, .field > .lb { font-size: var(--fs-1); font-weight: 600; color: var(--ink-2); }
.field input, .field select, .field textarea, .inp { min-height: 38px; padding: 7px 10px; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--surface); width: 100%; min-width: 0; }

.field .hint { font-size: var(--fs-1); color: var(--ink-3); }
.field .err { font-size: var(--fs-1); color: var(--bad); }
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 10px 12px; }
.check { display: inline-flex; align-items: center; gap: 8px; min-height: 32px; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }

/* Thiết lập */
.setup { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 20px; align-items: start; }
.subnav { display: grid; gap: 2px; position: sticky; top: 72px; }
.subnav button { display: flex; justify-content: space-between; align-items: center; gap: 8px; border: 0; background: none; padding: 8px 10px; min-height: 40px; border-radius: var(--r-s); text-align: left; cursor: pointer; color: var(--ink-2); }
.subnav button[aria-current="page"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: inset 0 0 0 1px var(--line); }
.subnav .dotok, .subnav .dotno { font-size: var(--fs-1); font-weight: 600; }
.subnav .dotok { color: var(--good); } .subnav .dotno { color: var(--warn); }
.md-split { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.issue { display: flex; gap: 8px; font-size: var(--fs-2); }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; font-size: var(--fs-2); }
.kv dt { color: var(--ink-2); } .kv dd { margin: 0; overflow-wrap: anywhere; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { padding: 2px 9px; border-radius: 999px; background: var(--surface-2); font-size: var(--fs-1); }
.tag.bad { background: var(--bad-soft); color: var(--bad); }
.cardlist { display: grid; gap: 10px; }
.citem { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surface); }
.citem.off { opacity: .6; }
.crit { display: grid; grid-template-columns: minmax(0, 1fr) 90px auto; gap: 6px; align-items: center; }

/* Nội dung bài */
.content-text { white-space: pre-wrap; overflow-wrap: anywhere; padding: 12px 14px; border-radius: var(--r-s); background: var(--surface-2); font-size: var(--fs-2); line-height: 1.6; }
.content-text.rich { white-space: normal; padding: 16px 20px; font-size: var(--fs-4); line-height: 1.7; color: var(--ink); }
.content-text.rich > * { max-width: 70ch; }
.content-text.rich p { margin: 0 0 .75em; }
.content-text.rich .rt-h1 { font-size: var(--fs-6); margin: .2em 0 .5em; }
.content-text.rich .rt-h2 { font-size: var(--fs-5); margin: 1.2em 0 .4em; padding-top: .9em; border-top: 1px solid var(--line); }
.content-text.rich .rt-h3 { font-size: var(--fs-4); margin: 1em 0 .3em; }
.content-text.rich > :first-child { margin-top: 0; padding-top: 0; border-top: 0; }
.content-text.rich > :last-child { margin-bottom: 0; }
.content-text.rich ul, .content-text.rich ol { margin: 0 0 .75em; padding-left: 1.4em; }
.content-text.rich li { margin: .25em 0; }
.content-text.rich ul.steps { list-style: none; padding-left: 0; display: grid; gap: 6px; }
.content-text.rich ul.steps li { margin: 0; padding: 6px 10px; border-left: 3px solid var(--accent); background: var(--surface); border-radius: 0 var(--r-s) var(--r-s) 0; }
.content-text.rich strong { font-weight: 600; }
.content-text mark { background: var(--bad-soft); color: var(--bad); border-radius: 3px; padding: 0 2px; }
.content-text mark.note { background: var(--warn-soft); color: var(--warn); }
.warns { display: grid; gap: 6px; }
.warn-i { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: baseline; font-size: var(--fs-2); }
.lvl { font-size: var(--fs-1); font-weight: 700; padding: 1px 6px; border-radius: 4px; }
.lvl.error { background: var(--bad-soft); color: var(--bad); } .lvl.note { background: var(--warn-soft); color: var(--warn); }
.score { display: grid; gap: 6px; }
.score .tot { display: flex; align-items: baseline; gap: 8px; }
.score .tot b { font-family: var(--f-body); font-size: var(--fs-6); font-variant-numeric: tabular-nums; }
.bar { display: grid; grid-template-columns: minmax(0, 1fr) 70px 26px; gap: 8px; align-items: center; font-size: var(--fs-1); }
.bar i { display: block; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.bar i span { display: block; height: 100%; background: var(--accent); }
.mock { font-size: var(--fs-1); font-weight: 600; padding: 1px 6px; border-radius: 4px; background: var(--surface-2); color: var(--ink-2); }

@media (max-width: 1100px) {
  .setup { grid-template-columns: minmax(0, 1fr); }

}

  .progress.open { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; }

  .progress.open .pstep::before { top: 6px; bottom: 6px; left: 0; right: auto; width: 4px; height: auto; }

  .mcards { display: grid; gap: 12px; }

@media (max-width: 760px) {

  .tabbar { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .tabbar button { display: grid; justify-items: center; gap: 2px; min-height: 56px; padding: 6px 2px; border: 0; background: none; font-size: var(--fs-1); color: var(--ink-2); cursor: pointer; }
  .tabbar button[aria-current="page"] { color: var(--accent); font-weight: 700; }
  .kpis { grid-template-columns: minmax(0, 1fr); }
  .weekpick select { max-width: 160px; }
  .hide-sm { display: none !important; }
  h1 { font-size: var(--fs-6); }
  .crit { grid-template-columns: minmax(0, 1fr) 70px auto; }
}
@media (prefers-reduced-motion: no-preference) {
  .drawer { animation: slidein .18s ease-out; }
  .drawer.center { animation: none; }
  @keyframes slidein { from { transform: translateX(24px); opacity: .6; } to { transform: none; opacity: 1; } }
}
.li mark, #res-list mark { background: var(--mark-soft); color: var(--ink); padding: 0 2px; border-radius: 3px; box-shadow: inset 0 -2px 0 var(--mark); }
#res-count { margin: 6px 0 8px; min-height: 18px; }

.inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; margin-top: 14px; }

/* v2.8 */
.weeklabel { display: inline-flex; align-items: baseline; gap: 8px; min-width: 0; white-space: nowrap; }
.weekpick input[type="date"] { min-height: 34px; padding: 4px 8px; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--surface); color: var(--ink); font: inherit; }

.day.today { box-shadow: inset 0 0 0 2px var(--mark); }

.dl-day.today > .day-h { background: var(--mark-soft); color: var(--mark-ink); box-shadow: inset 0 -3px 0 var(--mark); }
.dl-day.today > .day-h .t, .dl-day.today > .day-h b { color: var(--mark-ink); }

/* ===== Phân cấp thị giác (13/10/2026): 1 Tập trung · 2 Vùng làm việc · 3 Phụ ===== */
:root { --bg: #eef1f4; }

/* Cấp 1 · Tập trung: việc tiếp theo + tiến độ trong một khối */
.focus { display: grid; gap: 0; border-radius: var(--r-m); overflow: hidden; border: 1px solid color-mix(in srgb, var(--mark) 70%, transparent); background: var(--surface); box-shadow: 0 2px 4px rgb(16 24 40 / 6%), 0 10px 28px rgb(16 24 40 / 8%); }

/* Cấp 2 · Vùng làm việc: lịch / ma trận nổi trên nền */

/* Sơ đồ layout của Format (mục 10.13) */
.slot-dialog { width: min(600px, calc(100% - 24px)); }
.fl-wrap { display: grid; gap: 8px; padding: 12px; border-radius: var(--r-m); background: var(--surface-2); border: 1px solid var(--line); }

.fl-img { position: relative; width: 100%; background: repeating-linear-gradient(45deg, var(--surface-2), var(--surface-2) 8px, color-mix(in srgb, var(--line) 70%, transparent) 8px, color-mix(in srgb, var(--line) 70%, transparent) 16px); display: grid; place-items: center; border-top: 1px dashed var(--line-strong); border-bottom: 1px dashed var(--line-strong); }
.fl-img span { font-size: var(--fs-1); color: var(--ink-3); background: var(--surface); padding: 2px 6px; border-radius: 4px; position: absolute; bottom: 6px; left: 6px; }
.fl-cardimg em { font-style: normal; font-weight: 700; font-size: var(--fs-2); background: var(--surface); padding: 6px 10px; border-radius: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.12); }

/* View: các mục dưới khung bài dùng thẻ có số như Cấu hình slot, nền xám để thẻ nổi */

/* Trình chỉnh sửa Markdown (mục 10.28) */

## Trả lời

- Thành công: \`200\` hoặc \`201\` với \`{"id": "...", "url": "https://.../blog/slug", "status": "scheduled"}\`. AutoContent lưu \`url\` làm link bài để đo số liệu.

### Số liệu và phát hiện
Nhiều người đi làm đăng ký khóa học trực tuyến nhưng không duy trì qua tháng đầu. Theo Trung tâm Dữ liệu Giáo dục (mô phỏng): 41% người đi làm từng bỏ dở khóa học trực tuyến trong tháng đầu. Phần lớn người học bắt đầu rất tích cực trong tuần đầu, rồi lịch học thưa dần khi công việc dồn lại.

Con số bốn mươi mốt phần trăm nói trên đến từ một cuộc khảo sát trực tuyến dành cho người đang đi làm toàn thời gian, phần đông là nhân viên văn phòng, kỹ sư, kế toán và người làm kinh doanh ở các thành phố lớn. Người trả lời được hỏi họ đã từng đăng ký những khóa học nào trong vài năm gần đây, học được bao lâu thì dừng, và điều gì xảy ra ngay trước lúc họ dừng. Nói cách khác, cứ khoảng mười người thì có hơn bốn người từng bỏ ngang một khóa học ngay trong tháng đầu tiên, khi khóa học mới chỉ đi được một đoạn ngắn.

Điều đáng chú ý không nằm ở việc người ta bỏ, mà ở hình dạng của quá trình bỏ. Nhóm nghiên cứu mô tả một đường cong khá giống nhau ở nhiều người: tuần đầu học dày, có người học gần như mỗi tối và còn học thêm vào cuối tuần; tuần thứ hai bắt đầu có buổi lỡ; sang tuần thứ ba thì khoảng cách giữa các buổi dài ra, và đến cuối tháng thì khóa học nằm im trong ứng dụng. Ít ai bỏ vì một quyết định rõ ràng kiểu hôm nay mình thôi không học nữa. Phần lớn chỉ trôi dần ra xa cho đến khi quay lại trở thành một việc quá nặng nề.

Khảo sát cũng ghi nhận rằng người bỏ dở không phải là người thiếu động lực ban đầu. Ngược lại, nhiều người trong nhóm này lại là những người đặt mục tiêu tham vọng nhất lúc đăng ký: học một tiếng mỗi tối, hoàn thành cả khóa trong sáu tuần, hay học thêm từ vựng vào giờ nghỉ trưa. Nhóm duy trì được lâu hơn thường đặt mục tiêu khiêm tốn đến mức chính họ cũng thấy hơi ngại khi nói ra. Phát hiện này gợi ý rằng sự hăng hái lúc đầu, nếu biến thành một kế hoạch quá dày, có thể trở thành gánh nặng ở những tuần sau.

Cần đọc các con số này với sự thận trọng. Đây là dữ liệu tự khai, phản ánh cách người học nhớ và kể lại trải nghiệm của mình, chứ không phải nhật ký học được ghi tự động. Dù vậy, hình mẫu học dày rồi thưa dần xuất hiện đủ thường xuyên để trở thành điểm xuất phát hữu ích cho người đang muốn học lại.

Khi được hỏi điều gì sẽ giúp họ học tiếp, nhóm từng bỏ dở ít khi nhắc đến giáo trình hay giáo viên. Câu trả lời lặp lại nhiều nhất xoay quanh thời gian và sức lực: giá như mỗi buổi ngắn hơn, giá như lỡ một buổi thì không bị tụt lại quá xa, giá như có cách quay lại mà không phải học bù. Những mong muốn này cho thấy nội dung khóa học chưa hẳn là vấn đề chính; vấn đề nằm ở cách người học tự xếp khóa học vào cuộc sống của mình.

### Vì sao
Nhóm bỏ dở thường nêu cùng một lý do: kế hoạch ban đầu đặt quá nặng so với quỹ thời gian thực tế sau giờ làm. Khi lỡ một buổi, họ cảm thấy nợ bài và càng ngại quay lại.

Khi lập kế hoạch, người ta thường hình dung một buổi tối lý tưởng: về nhà đúng giờ, ăn tối xong là ngồi vào bàn, đầu óc còn minh mẫn. Nhưng tuần làm việc thật hiếm khi như vậy. Có tối phải ở lại công ty chốt báo cáo, có tối con ốm, có tối chỉ đơn giản là quá mệt sau một ngày họp liên tục. Một kế hoạch dựa trên buổi tối lý tưởng sẽ vỡ ngay ở buổi tối không lý tưởng đầu tiên.

Cảm giác nợ bài là mắt xích quan trọng nhất. Nếu mục tiêu là một tiếng mỗi tối, thì lỡ một tối nghĩa là đang thiếu một tiếng, lỡ ba tối là thiếu ba tiếng. Khoản nợ đó lớn dần trong đầu người học, và mỗi lần mở ứng dụng ra, họ không thấy một buổi học mới mà thấy cả đống việc còn tồn. Để tránh cảm giác khó chịu ấy, cách dễ nhất là không mở ứng dụng nữa. Đó là lý do nhiều người tưởng mình lười, trong khi thực ra họ đang né một cảm giác thất bại do chính kế hoạch tạo ra.

### Số liệu và phát hiện
Cuộc khảo sát hỏi thành viên một cộng đồng học tiếng Anh về cách họ giữ lịch học. Theo Cộng đồng Người học Tiếng Anh (mô phỏng): Người học có bạn đồng hành duy trì lịch học cao gấp 2 lần. Người học một mình thường nói không có ai biết khi mình bỏ, nên việc bỏ buổi trở nên rất dễ dàng.

Người tham gia khảo sát là thành viên đang sinh hoạt trong cộng đồng, phần lớn là người đi làm ở độ tuổi từ cuối hai mươi đến đầu bốn mươi, làm trong các ngành như kinh doanh, công nghệ, tài chính và chăm sóc khách hàng. Họ được hỏi họ học một mình hay cùng người khác, bao lâu thì luyện một lần, và trong vài tháng gần nhất họ đã giữ được lịch học đến mức nào. Bạn đồng hành ở đây được hiểu khá rộng: có thể là đồng nghiệp, bạn bè, người thân, hoặc một thành viên quen qua cộng đồng.

Kết quả cho thấy nhóm có bạn đồng hành giữ lịch học cao gấp đôi nhóm học một mình. Điều đáng chú ý là hình thức đồng hành trong nhiều trường hợp rất đơn giản. Không phải ai cũng học chung một lớp hay gặp nhau trực tiếp; nhiều cặp chỉ nhắn tin cho nhau mỗi tối, gửi một đoạn ghi âm ngắn hoặc báo đã luyện xong. Có vẻ chính sự hiện diện của một người khác, người biết bạn có học hay không, mới là yếu tố tạo khác biệt, hơn là nội dung học chung.

Ở chiều ngược lại, những người học một mình mô tả một trải nghiệm khá giống nhau. Khi một buổi bị bỏ, không có hệ quả nào xảy ra, không ai hỏi, không ai thất vọng. Buổi bỏ thứ hai còn dễ hơn buổi đầu, và đến buổi thứ ba thì việc không học đã trở thành mặc định. Nhiều người nói họ không thiếu động lực khi bắt đầu, mà thiếu một lý do để không bỏ vào những tối mệt.

Khảo sát cũng hỏi về những cặp đồng hành không thành. Một số cặp tan rã khi hai người có mục tiêu quá khác nhau, chẳng hạn một người muốn luyện thi, một người chỉ cần nói trong họp. Một số khác dừng vì lịch không khớp, người này rảnh buổi sáng, người kia chỉ rảnh đêm muộn. Những chi tiết này cho thấy bạn đồng hành có ích nhất khi hai bên có mục tiêu gần nhau và một khung giờ chung dễ giữ.

Cũng như mọi khảo sát dựa trên lời tự kể, kết quả này phản ánh trải nghiệm của những người đang tham gia cộng đồng, vốn có thể đã có động lực học cao hơn mặt bằng chung. Vì thế, con số gấp đôi nên được xem như một tín hiệu đáng thử nghiệm, chứ không phải quy luật cho tất cả mọi người.

### Vì sao
Những người có một bạn đồng hành, dù chỉ nhắn nhau mỗi tối, kể rằng họ ngại là người bỏ trước nên giữ lịch tốt hơn. Một số giáo viên lưu ý rằng có người học tốt hơn với buổi dài cuối tuần nếu có mục tiêu rõ, nên không nên khẳng định một cách học đúng cho mọi người.

Khi học một mình, lời hứa với chính mình rất dễ thương lượng lại. Tối nay mệt quá, mai học bù cũng được; tuần này bận, tuần sau tính. Không có ai phản đối, nên lý do nào nghe cũng hợp lý. Khi có một người đang chờ tin nhắn của bạn, lời hứa ấy trở thành lời hứa với người khác, và phần lớn chúng ta coi trọng lời hứa với người khác hơn lời hứa với bản thân.

Tâm lý ngại là người bỏ trước hoạt động theo cách khá tinh tế. Không ai bắt buộc ai, cũng không có hình phạt nào, nhưng ý nghĩ rằng bạn mình vẫn đang cố gắng còn mình thì bỏ cuộc tạo ra một chút áy náy đủ để kéo người ta ngồi xuống luyện vài phút. Mỗi người vừa là người được nhắc, vừa là người nhắc, nên trách nhiệm được chia đều và không ai cảm thấy bị giám sát.

Bạn đồng hành còn mang lại một lợi ích ít được nhắc đến: có người nghe thật. Khi luyện nói một mình, bạn nói vào khoảng không và khó biết người khác có hiểu mình không. Khi gửi tin nhắn thoại cho đồng nghiệp, bạn đang giao tiếp thật, dù ở quy mô rất nhỏ. Người kia trả lời, hỏi lại hoặc phản hồi, và cuộc trao đổi ấy gần với các tình huống công việc hơn nhiều so với tự nói với gương.

Ví dụ, hai chuyên viên chăm sóc khách hàng tên Nga và Đạt cùng phải trả lời cuộc gọi của khách nước ngoài. Họ thống nhất mỗi tối chín giờ, mỗi người gửi một tin nhắn thoại kể lại một tình huống khó trong ngày. Nhờ nghe nhau, họ học được cách xử lý của người kia, và vì biết bạn đang chờ, cả hai hiếm khi bỏ lượt.

Tuy vậy, lưu ý của các giáo viên là có cơ sở. Có những người thấy việc phải báo cáo với ai đó là một áp lực khó chịu, hoặc lịch làm việc của họ quá thất thường để hẹn giờ cố định với ai. Có người lại học tốt nhất với một buổi dài, tập trung, vào cuối tuần, khi họ có mục tiêu cụ thể như chuẩn bị cho một chuyến công tác. Bạn đồng hành là một công cụ hữu ích, không phải con đường duy nhất.

Điều quan trọng là nhận ra kiểu người học của chính mình. Nếu bạn từng bắt đầu nhiều lần rồi lặng lẽ bỏ mà không ai hay biết, đó là dấu hiệu khá rõ rằng bạn sẽ hưởng lợi từ một người đồng hành. Nếu bạn vốn tự giữ lịch tốt và chỉ thấy khó chịu khi phải nhắn tin báo cáo, có lẽ bạn nên giữ cách học riêng và chỉ tìm bạn luyện nói khi cần một người nghe thật.

### Cách làm

Giờ cố định nên là giờ mà cả hai đều chắc mình đã về nhà và có vài phút yên tĩnh. Nhiều cặp chọn một khoảng thời gian chứ không phải một phút chính xác, chẳng hạn từ tám đến chín giờ tối. Hãy cài nhắc nhở trên điện thoại cho cả hai, và thống nhất trước điều gì xảy ra khi có người phải tăng ca hay đi công tác.

Khảo sát cũng ghi nhận khác biệt giữa các nhóm người phỏng vấn. Quản lý trực tiếp, những người sẽ làm việc hằng ngày với ứng viên, đặc biệt chú ý đến phần thành tích vì nó cho họ hình dung về cách ứng viên giải quyết công việc. Chuyên viên tuyển dụng thì quan tâm nhiều hơn đến phần mong muốn, vì nó giúp họ đoán xem ứng viên có gắn bó lâu với vị trí hay không. Dù nhấn vào phần nào, cả hai nhóm đều mô tả phần giới thiệu tốt là phần họ có thể tóm lại trong một câu ngay sau khi ứng viên nói xong.

### Vì sao
Ấn tượng ban đầu đến từ việc ứng viên có đi thẳng vào ý chính hay không. Câu trả lời có cấu trúc rõ, dù từ vựng đơn giản, được đánh giá cao hơn câu trả lời dài và hoa mỹ nhưng khó theo dõi. Ứng viên thường mắc lỗi kể lại toàn bộ quá trình học tập và làm việc, khiến người nghe mất tập trung.

Ở phút đầu tiên, người phỏng vấn chưa có nhiều thông tin, nên họ đang tìm một khung để đặt ứng viên vào: người này đang làm gì, giỏi ở điểm nào, có hợp với vị trí đang tuyển không. Một phần giới thiệu chia ba ý trả lời đúng ba câu hỏi ngầm đó, nên người nghe không phải tự sắp xếp lại thông tin. Khi ứng viên kể theo dòng thời gian từ thời đại học, người nghe phải chờ rất lâu mới đến phần liên quan trực tiếp đến công việc.

Với người dùng tiếng Anh như ngôn ngữ thứ hai, cấu trúc còn là chỗ dựa khi căng thẳng. Nếu biết mình đang ở ý thứ hai, bạn dễ quay lại mạch dù vừa vấp một từ hay quên một cụm từ. Nếu nói tự do mà không có khung, chỉ một lần quên từ cũng đủ làm bạn mất hướng, rồi câu sau nối câu trước một cách lộn xộn.

Hãy hình dung hai ứng viên cùng ứng tuyển vị trí điều phối dự án. Người thứ nhất nói rất trôi chảy về trường đại học, các câu lạc bộ từng tham gia, ba công ty đã đi qua và sở thích đọc sách. Người thứ hai nói chậm hơn, dùng từ đơn giản, nhưng nêu rõ mình đang điều phối dự án gì, vừa giúp nhóm bàn giao một hạng mục khó đúng hạn, và muốn học thêm về làm việc với đối tác quốc tế. Sau buổi phỏng vấn, người phỏng vấn thường viết được nhận xét cụ thể về người thứ hai, còn về người thứ nhất chỉ nhớ mang máng là "nói hay".

Từ vựng hoa mỹ cũng có rủi ro riêng. Khi dùng những từ mình chưa thật quen, người nói dễ phát âm sai hoặc đặt từ sai ngữ cảnh, và người nghe phải đoán ý. Từ đơn giản đặt đúng chỗ giúp người nghe dồn sự chú ý vào nội dung thay vì vào cách diễn đạt, và giúp bạn nói ổn định hơn khi hồi hộp.

Còn một lý do thực tế nữa: phần giới thiệu thường định hướng các câu hỏi sau đó. Người phỏng vấn hay hỏi tiếp vào điều ứng viên vừa nhắc đến, nên khi bạn chủ động đưa ra một thành tích rõ ràng, bạn đang mời họ hỏi về điều mình kể tốt nhất. Nếu phần giới thiệu dàn trải, câu hỏi tiếp theo có thể rơi vào một chi tiết bạn chỉ nhắc qua và chưa chuẩn bị kỹ.

### Cách làm

- Thêm hai câu về một thành tích cụ thể.

Khi viết hai câu về công việc hiện tại, hãy nêu chức danh và phạm vi việc bạn phụ trách, thay vì chỉ nói tên công ty. Có thể bắt đầu bằng "I currently work as a project coordinator at a logistics company." (Hiện mình là điều phối viên dự án tại một công ty hậu cần.), rồi thêm "I am responsible for keeping our client projects on schedule." (Mình phụ trách giữ cho các dự án của khách hàng đúng tiến độ.). Hai câu này cần trả lời được câu hỏi: mỗi ngày bạn thực sự làm gì.

Một lưu ý quan trọng là chỉ thuộc ba ý, không thuộc từng chữ. Mỗi lần tập, hãy thử diễn đạt lại theo cách hơi khác một chút, để khi vào phòng phỏng vấn bạn không bị phụ thuộc vào một câu cố định. Nên chuẩn bị thêm một phiên bản rút gọn khoảng ba mươi giây cho trường hợp người phỏng vấn nói rõ là thời gian có hạn, và một phiên bản dài hơn đôi chút nếu được mời kể thêm.

Báo cáo chia người học thành ba nhóm theo mức duy trì. Nhóm đều đặn học ít nhất năm ngày mỗi tuần, nhưng mỗi buổi rất ngắn. Nhóm thất thường học dồn vài buổi dài rồi nghỉ nhiều ngày liền. Nhóm bỏ dở dừng hẳn sau tháng đầu tiên. Nhóm đều đặn có tổng thời gian học mỗi tuần không hơn nhóm thất thường, nhưng tiến bộ rõ hơn ở các bài kiểm tra nói.

Con số hai mươi hai phút là mức trung bình, nên nó che đi sự chênh lệch lớn giữa các ngày trong tuần. Dữ liệu nhật ký cho thấy nhiều người gần như không học vào những ngày giữa tuần bận rộn, rồi bù lại bằng một buổi dài vào thứ Bảy hoặc Chủ Nhật. Khảo sát bổ sung hỏi về khung giờ thường dùng, và câu trả lời phổ biến là sau bữa tối hoặc trước khi ngủ, khi năng lượng đã xuống thấp. Điều này giải thích vì sao nhiều buổi học dự định kéo dài lại kết thúc sớm hơn kế hoạch.

Trong nghiên cứu tám tuần, người tham gia làm bài kiểm tra nói ở đầu và cuối giai đoạn với cùng một dạng đề: kể lại một việc đã làm và trả lời một câu hỏi bất ngờ về công việc. Giám khảo chấm độc lập và không biết người được chấm thuộc nhóm nào. Tiêu chí gồm độ trôi chảy, số lần ngắt quãng, độ rõ ràng của ý và mức chính xác của câu. Nhóm luyện ngắn mỗi ngày tiến bộ rõ ở những tiêu chí gắn với tốc độ và mạch nói, còn độ chính xác ngữ pháp của hai nhóm thay đổi không khác nhau nhiều.

Ở phần phân nhóm theo mức duy trì, điều đáng chú ý là nhóm bỏ dở không phải những người có ít thời gian nhất. Nhiều người trong nhóm này khởi đầu bằng kế hoạch rất tham vọng, học dài mỗi tối trong tuần đầu, rồi dừng hẳn khi công việc dồn lại. Ngược lại, nhóm đều đặn thường bắt đầu nhỏ và giữ gần như nguyên mức đó suốt quá trình theo dõi.

Từ góc nhìn của người làm báo cáo, phát hiện quan trọng nhất không nằm ở con số thời gian mà ở hình dạng của lịch học. Hai người cùng dành khoảng hai tiếng rưỡi mỗi tuần có thể có kết quả rất khác nhau, tùy thời gian ấy được rải đều hay dồn vào một chỗ. Nhóm nghiên cứu khuyến nghị các ứng dụng nên hiển thị số ngày luyện nói trong tuần thay vì chỉ hiển thị tổng số phút, để người học nhìn thấy đúng điều đang tạo ra tiến bộ.

### Vì sao
Các tác giả giải thích rằng việc nói thường xuyên giữ cho các cụm câu quen thuộc luôn sẵn sàng, nên người nói ít phải nghĩ từng từ khi cần phản hồi nhanh. Nhóm học dồn cải thiện chậm hơn và có nhiều người giảm phong độ ở đầu tuần sau, khi phải khởi động lại. Kết quả chấm cho thấy cải thiện rõ nhất nằm ở số lần ngắt quãng, trong khi độ rõ ràng của ý tăng ở cả hai nhóm.

Thông điệp học thật nhiều mỗi ngày khó thực hiện với người đi làm và có thể làm họ nản khi bỏ lỡ một buổi. Mục tiêu nhỏ, cụ thể và có thể hoàn thành ngay cả vào ngày bận giúp người học giữ cảm giác tiến bộ thay vì cảm giác nợ bài. Người học cũng thường tính cả thời gian nghe thụ động vào thời gian học, nên đo bằng số lần nói thành tiếng phản ánh đúng mức luyện tập hơn số phút mở ứng dụng.

Nghiên cứu có hạn chế: mẫu khảo sát nhỏ và chủ yếu là người tự nguyện, nên kết luận chưa thể áp dụng cho mọi người. Một số giáo viên cũng cho rằng người thiếu nền ngữ pháp có thể lặp lại một lỗi nhiều tháng; họ đề nghị dành thời gian ngắn mỗi buổi để sửa lỗi phổ biến nhất. Hai hướng không loại trừ nhau, và thứ tự ưu tiên nên theo mục tiêu của người học.

Có thể so sánh việc nói với việc đi một con đường quen. Con đường được đi mỗi ngày luôn thông thoáng, còn con đường mỗi tuần mới đi một lần thì lần nào cũng phải dò lại. Khi người học nói một cụm như "I'm working on the report" hằng ngày, cụm đó dần thành một khối, và lúc cần dùng trong cuộc họp, họ không phải ráp từng từ. Người học dồn có thể nói khá tốt trong buổi học, nhưng đến thứ Hai các khối ấy đã lỏng ra.

Một ví dụ cụ thể: một nhân viên phải cập nhật tiến độ với trưởng nhóm người nước ngoài vào sáng thứ Hai. Nếu buổi luyện nói gần nhất đã cách gần một tuần, những câu quen như "Last week I finished…" phải nghĩ lại từ đầu. Nếu tối thứ Sáu và tối Chủ Nhật vừa nói vài phút về chính công việc ấy, câu chữ đã có sẵn, và phần chú ý được dành cho nội dung.

Về mặt động lực, mỗi buổi ngắn hoàn thành là một lần tự khẳng định nhỏ. Chuỗi ngày liên tiếp tạo ra mong muốn giữ nhịp, trong khi một kế hoạch dài bị lỡ dễ biến thành cảm giác thất bại và khiến người học trì hoãn tiếp. Vì vậy, mục tiêu nhỏ mà ngày mệt vẫn làm được có giá trị hơn mục tiêu lớn chỉ đạt được vào ngày rảnh. Những hạn chế mà nghiên cứu nêu ra cũng nhắc rằng luyện đều là điều kiện cần cho độ trôi chảy, nhưng không thay được phản hồi về lỗi; kết hợp cả hai sẽ cân bằng hơn.

Còn một lý do thực tế nữa: buổi ngắn ít bị công việc chen ngang. Một buổi dài cuối tuần rất dễ bị hủy vì việc gia đình, một cuộc hẹn hay đơn giản là mệt, và khi đã hủy thì cả tuần trôi qua không luyện gì. Vài phút mỗi tối thì gần như luôn tìm được chỗ trong lịch, kể cả trong tuần cao điểm cuối quý.

### Cách làm
- Chọn một khung giờ cố định mỗi ngày, gắn với một việc bạn đã làm sẵn.

Khi nghe lại bản ghi âm, đừng cố sửa mọi thứ. Chọn lỗi lặp lại nhiều nhất hoặc chỗ bạn ngập ngừng lâu nhất, rồi nói lại đúng câu đó vài lần cho trơn. Nếu khó tự nhận ra lỗi, có thể nhờ một đồng nghiệp nghe giúp hoặc dùng công cụ chuyển giọng nói thành chữ để xem máy có hiểu đúng ý không. Cách đếm chuỗi ngày có thể làm thật đơn giản: đánh dấu lên tờ lịch giấy dán cạnh bàn, mỗi ngày có nói thành tiếng là một dấu.

Với ngày bận, câu duy nhất có thể là "Today was busy, but I finished the client report" (Hôm nay bận, nhưng mình đã xong báo cáo cho khách hàng). Một câu như vậy nghe có vẻ không đáng kể, nhưng nó giữ cho chuỗi không đứt và giữ thói quen ở đúng chỗ. Chỉ nên tăng thời lượng thật chậm, khi việc luyện đã trở nên tự nhiên trong vài tuần liền; tăng quá sớm dễ đưa bạn trở lại kiểu học dồn.

### Vì sao
Họp trực tuyến có nhịp phát biểu nhanh hơn và khoảng lặng ngắn hơn họp trực tiếp. Người tham gia khó có thời gian nghĩ câu trả lời, trong khi chậm một nhịp là người khác đã nói tiếp. Nhiều người phát biểu ít đi vì ngại chen ngang qua màn hình, nhất là khi âm thanh bị trễ, và tỷ lệ bật camera thấp hơn khi cuộc họp dùng tiếng Anh vì họ ngại bị nhìn thấy khi đang tìm từ.

Người học thường ôn quá nhiều từ vựng chuyên ngành mà bỏ qua các mẫu câu nền tảng. Trong khi đó, phần lớn thời gian của một cuộc họp nội bộ dùng đi dùng lại một nhóm nhỏ câu quen thuộc. Học thuộc và luyện nói to những câu đó là cách nhanh nhất để tăng sự tự tin ở cuộc họp tiếp theo. Các câu nối nhỏ như "Let me think about that" hay "Good point" không mang thông tin chính nhưng cho người nói thêm một hai giây suy nghĩ.

Ở họp trực tiếp, người ta có thể dùng ánh mắt, cử chỉ hoặc hơi nghiêng người về phía trước để báo hiệu muốn nói. Trên màn hình, những tín hiệu ấy gần như biến mất, nên lời nói phải tự làm nhiệm vụ giữ lượt. Đó là lý do các câu như "Can I jump in here?" (Mình xen vào một chút được không?) quan trọng hơn hẳn trong họp trực tuyến. Chúng không chứa nội dung chuyên môn, nhưng mở ra khoảng trống để nội dung được nói ra.

Hãy hình dung một cuộc họp rà soát với đội ở Ấn Độ, khi trưởng nhóm hỏi liệu hạn chót thứ Sáu có khả thi không. Người biết dữ liệu đang chậm có thể mất nhiều giây để ghép câu từ đầu. Nhưng nếu đã quen với "From my side, I think we need two more days", câu trả lời đến gần như ngay lập tức. Học theo chức năng giúp người nói biết ngay mình đang cần loại câu nào, thay vì lục trong trí nhớ một từ chuyên ngành phù hợp.

Học mẫu câu theo nhóm chức năng cũng giúp nhớ lâu hơn, vì mỗi câu gắn với một khoảnh khắc cụ thể trong cuộc họp. Khi khoảnh khắc đó lặp lại, như lúc cần xác nhận hay lúc kết thúc, câu tương ứng tự bật ra. Từ vựng chuyên ngành thì người học đã tiếp xúc hằng ngày qua tài liệu và email, nên thường không phải là điểm nghẽn khi nói.

Ngoài ra, họp trực tuyến thường có cấu trúc khá giống nhau: chào hỏi, điểm qua chương trình, cập nhật từng mục, hỏi đáp và chốt việc. Chính sự lặp lại này làm cho mẫu câu theo chức năng phát huy tác dụng. Người tham dự chỉ cần biết mình đang ở giai đoạn nào của cuộc họp là có thể đoán được loại câu sẽ cần, giống như người lái xe quen đường biết trước chỗ nào phải rẽ.

### Cách làm
- Nhóm xin làm rõ: "Could you say that again?" và "Just to confirm, you mean…".
- Nhóm bày tỏ ý kiến: "From my side, I think…" và "One thing to add is…".
- Nhóm chốt việc: "Let me summarize the next steps" và "I will send the notes by tomorrow".
- Chọn ba câu nối quen miệng nhất và luyện nói thật nhanh cho đến khi không phải nghĩ.
- Khi chưa chen vào được, dùng phần trò chuyện chữ để nêu ý rồi xin nói thêm.

Các nhóm cũng có thể đặt quy ước phát biểu, như dành thời gian cuối mỗi mục để hỏi ý kiến từng người, giúp người ngại nói tiếng Anh có điểm vào rõ ràng. Bật micro từng người một cách nhẹ nhàng cũng giúp giảm cảm giác bị quan sát.

Bắt đầu bằng việc chọn hai câu từ mỗi nhóm, tổng cộng sáu câu, và chỉ dùng chừng đó trong tuần đầu. Trước mỗi cuộc họp, đọc to cả sáu câu một lượt để đánh thức chúng. Trong cuộc họp, đặt mục tiêu dùng ít nhất một câu, ưu tiên nhóm xin làm rõ vì đó là nhóm có nhiều cơ hội dùng nhất. Khi đã quen, thêm dần các biến thể như "Sorry, you cut out for a second" (Xin lỗi, tiếng của bạn vừa bị mất một chút) cho lúc đường truyền kém, hay "I agree with Nam's point" (Mình đồng ý với ý của Nam) khi muốn ủng hộ ý người khác.

Với câu nối, nên chọn những câu bạn thấy tự nhiên khi nói, như "That makes sense" (Nghe hợp lý đấy), "Good question" (Câu hỏi hay) hoặc "Let me check and get back to you" (Để mình kiểm tra rồi phản hồi lại). Nói nhanh vài lần mỗi ngày cho đến khi câu bật ra như tiếng Việt. Khung trò chuyện chữ cũng rất hữu ích: gõ "I have a question about the budget" rồi chờ người chủ trì mời nói là cách lịch sự để giữ chỗ khi chưa tìm được lúc chen vào.

Để luyện trước, có thể mô phỏng một cuộc họp ngắn với chính mình: bật chế độ ghi hình trên máy tính, đọc một đoạn tình huống giả định rồi trả lời bằng đúng các mẫu câu đã chọn. Cách này giúp bạn quen với việc nói trước màn hình và nghe lại giọng mình qua loa, điều mà nhiều người thấy lạ trong những lần đầu. Nếu có đồng nghiệp cùng muốn luyện, hai người có thể thay nhau đóng vai người chủ trì và người tham dự trong mười lăm phút giờ nghỉ trưa.

Khi áp dụng, không cần dùng mẫu câu một cách máy móc. Nếu nghe đồng nghiệp nước ngoài dùng một cách nói khác cho cùng chức năng, hãy ghi lại và thử dùng ở buổi họp sau. Cuối mỗi tuần, xem lại danh sách và thay những câu chưa từng dùng bằng câu bạn thực sự cần.

### Ngộ nhận thường gặp
Ngộ nhận: Muốn họp tốt bằng tiếng Anh phải học thật nhiều từ vựng chuyên ngành. Thực tế: Khoảng 20 mẫu câu bao phủ phần lớn tình huống trong họp nội bộ.

Ngộ nhận: Tắt camera và micro là an toàn nhất khi chưa tự tin. Thực tế: Im lặng suốt buổi khiến cuộc họp kém hiệu quả; một câu mẫu dùng đúng lúc đã đủ để tham gia.

Ngộ nhận về từ vựng chuyên ngành dễ hiểu, vì nó cho cảm giác học đúng trọng tâm công việc. Nhưng phần lớn thuật ngữ người đi làm đã gặp hằng ngày qua tài liệu, còn chỗ họ hay mắc lại là những câu rất bình thường như xin nói lại hay hẹn gửi biên bản. Với việc tắt camera và micro, im lặng giúp tránh lỗi trước mắt, nhưng khiến người khác không biết bạn đã hiểu hay chưa, và lâu dần làm bạn mất chỗ đứng trong nhóm. Bật camera ở phần đầu và cuối buổi, nơi thường có lời chào và phần chốt việc dễ đoán, là một bước trung gian hợp lý.

			lines = lines.map((l, i) => /^##\s/.test(l) && i !== titleFromH2 ? "#" + l : l);
			if (titleFromH2 < 0) {
				const title = h1i >= 0 ? lines[h1i].replace(/^#\s+/, "").trim() : "Topic 1";
				lines.splice(h1i >= 0 && h1i < firstSec[1] ? h1i + 1 : firstSec[1], 0, `## ${title}`);
			}
			changes.push(`Tệp chỉ có 1 Topic: đổi ${secLike} đề mục ## thành ### (mục bên trong Topic).`);
		}
		let nJoin = 0;
		const joined = [];
		lines.forEach((l) => {
			const prev = joined.length ? joined[joined.length - 1] : "";
			if (l.trim() && prev.trim() && !/^\s*#/.test(prev) && !/^\s*\|/.test(prev) && !/^\s*\*\*[^*]+\*\*\s*$/.test(prev) && !TF_STRUCT.test(l) && !TF_FIELD.test(l) && !/^(Bước|Slide)\s*\d+:/.test(l.trim()) && !/[.!?…:;"”)\]]\s*$/.test(prev)) {
				joined[joined.length - 1] = prev.replace(/\s+$/, "") + " " + l.trim();
				nJoin++;
				return;
			}
			joined.push(l.replace(/\s+$/, ""));
		});
		if (nJoin) changes.push(`Nối ${nJoin} dòng bị ngắt giữa câu thành đoạn.`);
		lines = joined;
		const fr = topicFrameOf(S);
		const topicStarts = lines.map((l, i) => /^##\s/.test(l) ? i : -1).filter((i) => i >= 0);
		const ranges = topicStarts.length ? topicStarts.map((s, k) => [s, k + 1 < topicStarts.length ? topicStarts[k + 1] : lines.length]) : [[-1, lines.length]];
		const renamed = [];
		let reordered = 0;
		const out = topicStarts.length ? lines.slice(0, topicStarts[0]) : [];
		ranges.forEach(([s, e], k) => {
			const blk = lines.slice(s < 0 ? 0 : s + 1, e);
			const title = s < 0 ? "" : lines[s].replace(/^##\s+/, "").trim();
			let pre = [], secs = [], cur = null;
			blk.forEach((l) => {
				const m = /^###\s+(.+?)\s*#*\s*$/.exec(l);
				if (m) {
					const sec = matchTopicSection(S, m[1]);
					const name = sec ? sec.name : m[1].trim();
					if (sec && name !== m[1].trim()) renamed.push(`"${m[1].trim()}" → "${name}"`);
					cur = {
						sec,
						name,
						lines: []
					};
					secs.push(cur);
					return;
				}
				(cur ? cur.lines : pre).push(l);
			});
			const groups = [];
			secs.forEach((x) => {
				if (x.sec || !groups.length) groups.push({
					key: x.sec ? fr.indexOf(x.sec) : -1,
					items: [x]
				});
				else groups[groups.length - 1].items.push(x);
			});
			const sorted = groups.map((g, i) => [g, i]).sort((a, b) => a[0].key - b[0].key || a[1] - b[1]).flatMap((a) => a[0].items);
			if (sorted.some((x, i) => x !== secs[i])) reordered++;
			const have = new Set(secs.filter((x) => x.sec).map((x) => x.sec.name));
			const miss = fr.filter((x) => !x.optional && !have.has(x.name)).map((x) => x.name);
			if (secs.length && miss.length) missing.push({
				order: k + 1,
				title,
				names: miss
			});
			if (s >= 0) out.push(lines[s]);
			out.push(...pre);
			sorted.forEach((x) => {
				out.push(`### ${x.name}`, ...x.lines);
			});
		});
		if (renamed.length) changes.push(`Đổi tên mục theo khung: ${[...new Set(renamed)].join(", ")}.`);
		if (reordered) changes.push(`Xếp lại các mục theo thứ tự khung ở ${reordered} Topic.`);
		const tidy = [];
		out.forEach((l) => {
			if (/^#{1,3}\s/.test(l) && tidy.length && tidy[tidy.length - 1].trim()) tidy.push("");
			if (!l.trim() && (!tidy.length || !tidy[tidy.length - 1].trim())) return;
			tidy.push(l);
		});
		const result = head + tidy.join("\n").trim() + "\n";
		return {
			md: result,
			changes,
			missing,
			changed: result.trim() !== raw.trim()
		};

	function matrixCounts(S, weekId) {

			total: 0

		cellsOf(S, weekId).forEach((c) => {
			if (!live.has(c.topicId)) return;

	function slotCounts(S, weekId) {

			total: 0

	function weekProgress(S, weekId) {
		const w = weekOf(S, weekId);

				n: i + 1,
				name,

			current: 1,
			allDone: false,

				PUBLISHED: 0,
				needsUpdate: 0,

		st.push({
			done: sc.total > 0,
			reason: sc.total ? "" : "Tuần chưa có slot"

			done: rows.length > 0,
			reason: rows.length ? `${rows.length} Topic` : "Chưa có Topic"
		});

		st.push({
			done: written,
			reason: rows.length && mc.EMPTY ? mc.EMPTY > nc ? `${mc.EMPTY - nc}/${mc.total} ô chưa viết` : `${nc} ô Câu chuyện nên Hủy` : ""
		});
		st.push({
			done: approved,
			reason: written && mc.DRAFT ? `${mc.DRAFT} ô chưa duyệt` : ""
		});
		st.push({
			done: dealt,
			reason: sc.EMPTY ? `${sc.EMPTY} slot chưa có bài` : ""
		});

			done: dealt && sc.DRAFT === 0 && sc.needsUpdate === 0,
			reason: sc.needsUpdate ? `${sc.needsUpdate} slot cần cập nhật` : dealt && sc.DRAFT ? `${sc.DRAFT} slot chưa duyệt${ic.boxes ? ` · ${ic.done}/${ic.boxes} ảnh` : ""}` : ""

			n: i + 1,
			name: STEP_NAMES[i]

		const firstOpen = steps.find((s) => !s.done);
		return {
			steps,
			current: firstOpen ? firstOpen.n : STEP_COUNT,
			allDone: !firstOpen,
			mc,
			sc,
			ic,
			gate: dealGate(S, weekId)

		const ready = slots.filter((s) => s.state === "APPROVED" || s.state === "PUBLISHED");

			due: due.length,

			late,

		};

	function validateState(S) {
		if (!S || typeof S !== "object") return {
			ok: false,
			error: "không phải đối tượng"
		};
		if (S.dataVersion !== "ac-edu-r4-0") return {
			ok: false,
			error: `phiên bản ${S.dataVersion}`
		};
		for (const k of [
			"channels",
			"columns",
			"formats",
			"weekTemplates",
			"weeks",
			"topicFiles",
			"topics",
			"cells",
			"slots",
			"audit"
		]) if (!Array.isArray(S[k])) return {
			ok: false,
			error: `thiếu danh sách ${k}`
		};
		if (!S.brand || !S.voice || !S.settings) return {
			ok: false,
			error: "thiếu brand/voice/settings"
		};
		return { ok: true };
	}
	function loadStateFromRaw(raw) {
		if (raw == null) return { status: "none" };
		try {
			const S = JSON.parse(raw);
			const m = S && typeof S.dataVersion === "string" && /^ac-edu-r([23])-/.exec(S.dataVersion);
			if (m) return {
				status: "old",
				version: S.dataVersion,
				label: m[1] === "2" ? "v2.6" : "v2.7"
			};
			const v = validateState(S);
			if (!v.ok) return {
				status: "corrupt",
				error: v.error
			};
			if (!S.ui) S.ui = { weekStart: null };
			migrateState(S);
			return {
				status: "ok",
				state: S
			};
		} catch (e) {
			return {
				status: "corrupt",
				error: "JSON hỏng"
			};
		}
	}

	function layoutIssues(text) {
		const w = [];
		const t = String(text || "");
		let pos = 0;
		const long = [], inline = [], oldLb = [];
		const boldBy = {};
		let sec = "";
		t.split("\n").forEach((line) => {
			const s = pos;
			pos += line.length + 1;
			const lb = labelOf(line);
			if (lb) {
				sec = lb;
				if (/^\s*\[/.test(line)) oldLb.push([s, s + line.length]);
				return;
			}
			if (!line.trim() || /^\s*#/.test(line)) return;
			if (countWords(line) > 80 && !/^\s*([-*•]|\d+[.)])\s/.test(line)) long.push([s, s + line.length]);
			if ((line.match(/(^|\s)Bước\s*\d+:/g) || []).length >= 2) inline.push([s, s + line.length]);
			boldBy[sec] = (boldBy[sec] || 0) + (line.match(/\*\*(?=\S)[^*]+?\*\*/g) || []).length;
		});
		if (long.length) w.push({
			id: "HR-13",
			level: "note",
			text: `${long.length} đoạn quá 80 chữ; nên tách thành đoạn 2–3 câu.`,
			ranges: long.map((r) => [r[0], Math.min(r[1], r[0] + 60)])
		});
		if (inline.length) w.push({
			id: "HR-13",
			level: "note",
			text: "Các bước viết dồn trên một dòng; mỗi bước nên một dòng.",
			ranges: inline.map((r) => [r[0], Math.min(r[1], r[0] + 60)])
		});
		const many = Object.entries(boldBy).filter(([, n]) => n > 2);
		if (many.length) w.push({
			id: "HR-13",
			level: "note",
			text: `In đậm quá nhiều ở ${many.map(([k]) => `"${k || "đầu bài"}"`).join(", ")} (tối đa 2 chỗ mỗi đề mục).`
		});
		if (oldLb.length) w.push({
			id: "HR-13",
			level: "note",
			text: "Nhãn đoạn dạng [..] cũ; nên dùng đề mục \"## Tên đoạn\"."
		});
		return w;
	}
	function tidyMarkdown(text) {
		const lines = paraBreak(String(text || "").replace(/\r\n?/g, "\n")).split("\n").map((l) => {
			const lb = labelOf(l);
			return lb ? `## ${lb}` : l.replace(/\s+$/, "");
		});
		const out = [];
		lines.forEach((l) => {
			const prev = out.length ? out[out.length - 1] : null;
			const listy = (x) => /^\s*([-*•]\s|\d+[.)]\s|Bước\s*\d+:)/.test(x || "");
			if (prev != null && l.trim() && prev.trim() && !(listy(prev) && listy(l))) out.push("");
			if (!(l.trim() === "" && (prev == null || prev.trim() === ""))) out.push(l);
		});
		return out.join("\n").trim();
	}

				label: "Hook",
				sentences: (alt ? [splitSentences(hook).slice(-1)[0] || hook] : splitSentences(hook)).map((x, i) => i ? x : vary(x, genN)),
				trim: false

				trim: false
			});
		}

	function demoGate(S, startDate, step) {
		const wid = weekIdOf(startDate);
		const w = weekOf(S, wid);
		const locked = !!w && w.status === "CONFIRMED";
		const no = (reason) => ({
			ok: false,
			reason
		});
		if (step === "setup") return setupStatus(S).ok ? no("Thiết lập đã đủ") : {
			ok: true,
			reason: ""
		};
		if (step === "plan") {
			const g = canApplyTemplate(S, startDate);
			return g.ok ? {
				ok: true,
				reason: ""
			} : no(g.reason);
		}
		if (locked) return no("Tuần đã chốt. Bấm \"Mở lại để sửa\" trước.");
		if (step === "topics") return setupStatus(S).ok ? {
			ok: true,
			reason: ""
		} : no("Thiết lập chưa đủ: dùng \"Demo: Nạp Thiết lập\" ở Dashboard hoặc Setup");
		if (step === "write") {
			const g = w ? writeGate(S, wid) : {

				reasons: ["Chưa có Topic"]
			};
			return g.ok ? {
				ok: true,
				reason: ""
			} : no(g.reasons.join("; "));
		}
		if (step === "approve") return (w ? matrixCounts(S, wid).DRAFT : 0) ? {
			ok: true,
			reason: ""
		} : no(w && matrixCounts(S, wid).EMPTY ? "Viết ma trận trước" : "Không có ô nào chờ duyệt");

			const g = dealGate(S, wid);
			return g.ok ? {
				ok: true,
				reason: ""
			} : no(g.reasons.join("; "));
		}
		if (step === "review") {
			if (!w) return no("Chưa lập tuần");
			const sc = slotCounts(S, wid);
			const needImg = weekSlots(S, wid).some((s) => s.assets.some((a) => a.prompt && !a.versions.length));

				ok: true,
				reason: ""

		}

				ok: true,
				reason: ""

		}

	function demoRun(S, startDate, step, at) {

		const now = at || S.settings.demoNow;

			let n = 0;

		}
		if (step === "deal") {

			return r.ok ? {
				ok: true,

				ok: false,
				error: r.reasons.join("; ")

		}
		if (step === "review") {

				msg: `Đã duyệt ${a} slot, tạo ${im} ảnh mô phỏng.`

			});
			const r = confirmWeek(S, wid);
			if (!r.ok) return {
				ok: false,
				error: r.error
			};
			return {
				ok: true,
				msg: `${a ? `Đã duyệt ${a} slot và chốt` : "Đã chốt"} lịch bản ${r.revision}${r.published ? `, tự đăng ${r.published} slot đã đến giờ` : ""}.`
			};
		}
		if (step === "clear") {
			const ids = new Set(S.cells.filter((c) => c.weekId === wid).map((c) => c.id));
			S.slots = S.slots.filter((s) => s.weekId !== wid);
			S.cells = S.cells.filter((c) => !ids.has(c.id));
			S.topics = S.topics.filter((t) => t.weekId !== wid);
			S.topicFiles = (S.topicFiles || []).filter((f) => f.weekId !== wid);
			S.weeks = S.weeks.filter((w) => w.id !== wid);
			log(S, "demo-clear", "week", wid);
			return {
				ok: true,
				msg: "Đã làm trống tuần này."
			};
		}
		return {
			ok: false,
			error: "Bước không hợp lệ."
		};
	}
	function demoRunAll(S, startDate, at) {
		const done = [];
		[
			"setup",
			"plan",
			"topics",
			"write",
			"approve",

	function upsertById(list, items, onlyMissing) {
		let added = 0, replaced = 0;
		items.forEach((it) => {
			const i = list.findIndex((x) => x.id === it.id);
			if (i < 0) {
				list.push(clone(it));
				added++;
			} else if (!onlyMissing && JSON.stringify(list[i]) !== JSON.stringify(it)) {
				list[i] = clone(it);
				replaced++;
			}
		});
		return {
			added,
			replaced
		};
	}
	function demoSetupImpact(S, part) {

		if (part === "voice") return S.voice.md.trim() && S.voice.md !== TEMPLATES.voice ? 1 : 0;
		if (part === "channels") return diff(S.channels, d.channels);
		if (part === "columns") return diff(S.columns, d.columns);
		if (part === "formats") return diff(S.formats, d.formats);

	var CROP_RATIOS = {
		orig: {
			label: "Giữ tỉ lệ gốc",
			r: null
		},
		"1:1": {
			label: "1:1",
			r: 1

	function cropRect(iw, ih, ratio, zoom, cx, cy) {
		const r = CROP_RATIOS[ratio] && CROP_RATIOS[ratio].r || iw / ih;
		const z = Math.min(4, Math.max(1, Number(zoom) || 1));
		let w = iw, h = iw / r;
		if (h > ih) {
			h = ih;
			w = ih * r;
		}
		w /= z;
		h /= z;
		return {
			x: Math.min(iw - w, Math.max(0, (Number.isFinite(cx) ? cx : .5) * iw - w / 2)),
			y: Math.min(ih - h, Math.max(0, (Number.isFinite(cy) ? cy : .5) * ih - h / 2)),
			w,
			h
		};
	}
	function cropOutSize(ratio, w, h) {
		if (FRAME_RATIOS[ratio]) return FRAME_RATIOS[ratio].slice();
		const k = Math.min(1, 1600 / Math.max(w, h));
		return [Math.max(1, Math.round(w * k)), Math.max(1, Math.round(h * k))];
	}

	function readImageFile(file) {
		return new Promise((res, rej) => {
			if (!/^image\/(png|jpeg|webp|gif)$/.test(file.type)) return rej(/* @__PURE__ */ new Error("Chỉ nhận ảnh PNG, JPEG, WebP hoặc GIF."));
			const rd = new FileReader();
			rd.onerror = () => rej(/* @__PURE__ */ new Error("Không đọc được tệp."));
			rd.onload = async () => {
				try {
					const img = await loadImg(rd.result);
					const png = file.type === "image/png";
					const k = Math.min(1, (png ? 1200 : 1600) / Math.max(img.naturalWidth, img.naturalHeight));
					const c = document.createElement("canvas");
					c.width = Math.round(img.naturalWidth * k);
					c.height = Math.round(img.naturalHeight * k);
					const g = c.getContext("2d");
					if (!png) {
						g.fillStyle = "#fff";
						g.fillRect(0, 0, c.width, c.height);
					}
					g.drawImage(img, 0, 0, c.width, c.height);
					res({
						src: png ? c.toDataURL("image/png") : c.toDataURL("image/jpeg", .85),
						w: c.width,
						h: c.height
					});
				} catch (e) {
					rej(e);
				}
			};
			rd.readAsDataURL(file);
		});
	}
	async function addFilesToLibrary(files, tags) {
		let ok = 0;
		const errs = [];
		for (const f of files) try {
			const d = await readImageFile(f);
			const r = AC.addLibraryItem(S, Object.assign(d, {
				name: f.name.replace(/\.\w+$/, ""),
				tags
			}));
			if (r.ok) ok++;
			else errs.push(r.error);
		} catch (e) {
			errs.push(`${f.name}: ${e.message}`);
		}
		save();
		return {
			ok,
			errs
		};
	}

		drawCover(c.getContext("2d"), img, 0, 0, 1200, 800);
		return c.toDataURL("image/jpeg", .85);
	}

	var KEY_PREFIX = "autocontent.key.";
	var keyMem = {};
	function keyFor(p) {
		if (keyMem[p] != null) return keyMem[p];

	}

	function dataUrlToBlob(d) {
		const i = d.indexOf(",");
		const mime = (/^data:([^;,]+)/.exec(d) || [])[1] || "application/octet-stream";
		const bin = atob(d.slice(i + 1));
		const u = new Uint8Array(bin.length);
		for (let k = 0; k < bin.length; k++) u[k] = bin.charCodeAt(k);

	}

			r.onerror = () => rej(/* @__PURE__ */ new Error("Không đọc được dữ liệu ảnh."));

	async function shrinkDataUrl(d, max) {
		const img = await loadImg(d);
		const k = Math.min(1, (max || 1600) / Math.max(img.naturalWidth, img.naturalHeight));
		const c = document.createElement("canvas");
		c.width = Math.max(1, Math.round(img.naturalWidth * k));
		c.height = Math.max(1, Math.round(img.naturalHeight * k));
		const g = c.getContext("2d");
		g.fillStyle = "#fff";
		g.fillRect(0, 0, c.width, c.height);
		g.drawImage(img, 0, 0, c.width, c.height);
		return c.toDataURL("image/jpeg", .88);
	}
	async function apiFetch(req, timeoutMs) {
		const ctl = new AbortController();
		const tm = setTimeout(() => ctl.abort(), timeoutMs || 12e4);
		let body;
		if (req.form) {
			body = new FormData();
			req.form.forEach(([k, v]) => {
				if (v && typeof v === "object") body.append(k, dataUrlToBlob(v.file), v.name);
				else body.append(k, v);
			});
		} else if (req.json) body = JSON.stringify(req.json);
		let host = req.url;
		try {
			host = new URL(req.url).host;
		} catch (e) {}
		try {
			const r = await fetch(req.url, {
				method: body ? "POST" : "GET",
				headers: req.headers,
				body,
				signal: ctl.signal
			});
			const txt = await r.text();
			let j = null;
			try {
				j = txt ? JSON.parse(txt) : null;
			} catch (e) {
				j = { message: txt.slice(0, 200) };
			}
			return {
				status: r.status,
				body: j
			};
		} catch (e) {
			if (e.name === "AbortError") throw new Error("API không phản hồi kịp, thử lại sau.");
			throw new Error(`Không kết nối được tới ${host}. Trình xem artifact có thể chặn gọi ra ngoài, hoặc máy chủ không cho trình duyệt gọi thẳng. Thử tải tệp HTML về máy rồi mở bằng trình duyệt.`);
		} finally {
			clearTimeout(tm);
		}
	}

	var textProviderLabel = () => (AC.TEXT_PROVIDERS[AC.textApiOf(S).provider] || {}).label || "";
	async function textCall(job, maxTokens, light) {
		const cfg = AC.textCfgFor(S, light);
		if (cfg.provider === "claudeai") return sampleText(job, light);
		const req = AC.buildTextRequest(cfg, keyFor(cfg.provider), {
			system: job.system,
			user: job.user,
			maxTokens
		});
		if (!req.ok) throw new Error(req.error);
		const r = await apiFetch(req, 18e4);
		const p = AC.parseTextResponse(cfg.provider, r.status, r.body);
		if (!p.ok) throw new Error(p.error);
		return p.text;
	}
	async function sampleText(job, light) {
		let sample = null;
		try {
			sample = await window.claude.use("sample");
		} catch (e) {}
		if (!sample) throw new Error("Cần mở app trong trình xem artifact của claude.ai (bản mở ở máy không có mục này). Hoặc chọn Anthropic Claude và nhập khoá.");
		try {
			const r = await sample(`${job.system}\n\n${job.user}`, {
				modelTier: light ? "quick" : "default",
				cache: false
			});
			const t = String(r && r.text || "").trim();
			if (!t) throw new Error("AI không trả về chữ.");
			return t;
		} catch (e) {
			if (e && e.code === "not_granted") throw new Error("Bạn chưa cho phép artifact nhờ Claude. Bấm lại và chọn Cho phép.");
			if (e && e.code === "rate_limited") throw new Error("Đang bị giới hạn tốc độ, đợi một lúc rồi thử lại.");
			throw new Error(e && e.message || "Không gọi được Claude của claude.ai.");
		}
	}
	var callRetry = async (job, maxTokens, light) => {
		try {
			return await textCall(job, maxTokens, light);
		} catch (e) {
			if (!/không trả về chữ/.test(e.message)) throw e;
			return textCall(job, maxTokens, light);
		}
	};

	function orientImage(img, rot, flip) {
		const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height, k = Math.min(1, 2e3 / Math.max(iw, ih));
		const w0 = Math.round(iw * k), h0 = Math.round(ih * k), sw = rot % 180 ? h0 : w0, sh = rot % 180 ? w0 : h0;
		const c = document.createElement("canvas");
		c.width = sw;
		c.height = sh;
		const g = c.getContext("2d");
		g.translate(sw / 2, sh / 2);
		g.rotate(rot * Math.PI / 180);
		if (flip) g.scale(-1, 1);
		g.drawImage(img, -w0 / 2, -h0 / 2, w0, h0);
		return c;
	}
	function cropToDataUrl(oc, ratio, zoom, cx, cy) {
		const r = AC.cropRect(oc.width, oc.height, ratio, zoom, cx, cy);
		const [W, H] = AC.cropOutSize(ratio, r.w, r.h);
		const c = document.createElement("canvas");
		c.width = W;
		c.height = H;
		const g = c.getContext("2d");
		g.imageSmoothingQuality = "high";
		g.drawImage(oc, r.x, r.y, r.w, r.h, 0, 0, W, H);
		return {
			src: c.toDataURL("image/jpeg", .88),
			W,
			H
		};
	}

		const q = AC.fold(view.tpcSearch || "").trim();
		return AC.topicsOf(S, w.id).map((r) => {
			const v = AC.topicCurrent(r);
			if (!v) return null;
			if (!q) return {
				r,
				v,
				n: 0
			};
			const inTitle = AC.fold(v.title).includes(q);
			const n = AC.fold(v.text).split(q).length - 1 + (inTitle ? 1 : 0);
			return n ? {
				r,
				v,
				n
			} : null;
		}).filter(Boolean);
	}

		const mc = AC.matrixCounts(S, w.id);

		const sum = AC.summarizeWarnings(ws);

			total: g.count,
			done: 0,
			stop: false
		};

	async function mxStep() {
		const run = view.mxRun;
		if (!run) return;
		const q = AC.writeQueue(S, run.weekId);
		if (run.stop || !q.length || AC.weekIdOf(curStart()) !== run.weekId) {
			view.mxRun = null;
			save();
			const left = AC.writeQueue(S, run.weekId).length;
			render();
			toast(run.stop || left ? `Đã viết ${run.done} ô · còn ${left} ô Trống.` : `Đã viết ${run.done} ô. Mời bạn duyệt từng ô.`);
			return;
		}
		const r = await withAiText((C) => AC.writeCellNow(C, q[0]));
		if (!r.ok) {
			view.mxRun = null;
			save();
			render();
			toast(r.error, "bad");
			return;
		}
		run.done++;
		save();
		if (view.screen === "matrix") {
			const t = document.getElementById("mx-table"), c = document.getElementById("mx-counts"), m = document.getElementById("mx-run");
			if (t) t.innerHTML = mxTableHtml(curWeek());
			if (c) c.innerHTML = mxCountsHtml(curWeek());

		}
		setTimeout(mxStep, MX_DELAY);
	}

	async function approveAllFlow(kind, w) {
		const isCell = kind === "cell";
		const clean = isCell ? AC.bulkApprovable(S, w.id) : AC.slotsApprovable(S, w.id);
		const warned = isCell ? AC.bulkWarned(S, w.id) : AC.slotsWarned(S, w.id);
		const unit = isCell ? "ô" : "slot";
		const name = (x) => {
			if (isCell) {
				const r = AC.byId(S.topics, x.cell.topicId);
				return `Topic ${r ? r.order : "?"} × ${AC.cellLabel(S, x.cell)}`;
			}
			return `${x.slot.time} ${AC.dmy(x.slot.date)} · ${fmtName(x.slot.formatId)}`;
		};
		if (!clean.length && !warned.length) return toast(`Không có ${unit} nào chờ duyệt.`, "bad");
		const res = await confirmBox({
			title: "Duyệt tất cả",
			ok: "Duyệt",
			extra: warned.length ? `<label class="check"><input type="checkbox" data-collect="all" ${clean.length ? "" : "checked"}> Duyệt cả ${warned.length} ${unit} có cảnh báo</label>
    <ul class="small" style="max-height:180px;overflow:auto;margin:6px 0 0">${warned.map((x) => `<li>${esc(name(x))}: ${esc(AC.summarizeWarnings(x.warnings).label)}</li>`).join("")}</ul>` : "",
			body: `<p>${clean.length} ${unit} Chưa duyệt không có cảnh báo sẽ được duyệt.${warned.length ? ` ${warned.length} ${unit} có cảnh báo (chỉ để tham khảo): đánh dấu ô bên dưới nếu muốn duyệt luôn, hoặc để lại xem từng ${unit}.` : ""}</p>`
		});
		if (!res) return;
		const all = res === true ? false : !!res.all;
		if (!all && !clean.length) return toast(`Chưa duyệt ${unit} nào: đánh dấu "Duyệt cả ${unit} có cảnh báo" hoặc duyệt từng ${unit}.`, "bad");
		const r = isCell ? AC.approveCellsBulk(S, w.id, null, all) : AC.approveSlotsBulk(S, w.id, null, all);
		commit(`Đã duyệt ${r.approved} ${unit}.${r.left ? ` Còn ${r.left} ${unit} chưa duyệt.` : ""}`);
	}
